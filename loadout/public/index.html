<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loadout</title>
<meta name="theme-color" content="#11141B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #11141B; --surface: #1A1F2B; --surface-alt: #151923;
    --border: #262D3B; --border-strong: #2C3342;
    --text: #F2F0EA; --muted: #A3ABBD; --gold: #E8A33D; --success: #4CAF8E; --danger: #E06C6C;
    --display: 'Space Grotesk', system-ui, sans-serif; --body: 'IBM Plex Sans', system-ui, sans-serif;
    --r-ctl: 10px; --r-card: 12px; --r-hero: 16px; --r-pill: 999px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.4; }
  body { min-height: 100dvh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 24px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .ic { display: inline-block; vertical-align: middle; flex: none; }

  /* Type */
  .eyebrow { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .eyebrow.gold { color: var(--gold); }
  h1 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 14px; }
  .top .brand { font-family: var(--display); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; }
  .top .date { font-size: 13px; color: var(--muted); font-weight: 500; }
  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 10px; margin-left: -6px; color: var(--muted); font-weight: 500; font-size: 14px; }

  /* Cards */
  .card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; }
  .card + .card, .section + .section { margin-top: 12px; }
  .hero { border-radius: var(--r-hero); border-color: var(--gold); padding: 18px 16px; }
  .hero.done { border-color: var(--success); }
  .hero .icon-wrap { width: 40px; height: 40px; border-radius: var(--r-ctl); background: var(--surface-alt); border: 1px solid var(--border-strong); display: grid; place-items: center; color: var(--gold); }
  .hero.done .icon-wrap { color: var(--success); }
  .hero .row { display: flex; gap: 12px; align-items: flex-start; }
  .hero h2 { font-size: 20px; margin-bottom: 2px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .section { margin-top: 20px; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }

  /* Currency strip */
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 10px; min-height: 72px; }
  .tile .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .val { font-size: 22px; margin-top: 4px; line-height: 1.1; }
  .tile .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; font-family: var(--body); }
  .tile.gold .lbl, .tile.gold .val { color: var(--gold); }
  .tile.gold .val small { color: var(--muted); }

  /* Level + streak */
  .level { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bar { height: 8px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--r-pill); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--gold); border-radius: var(--r-pill); transition: width .4s ease; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); border: 1px solid var(--border-strong); background: var(--surface-alt); font-size: 13px; font-weight: 500; min-height: 32px; }
  .pill.hot { color: var(--gold); border-color: var(--gold); }
  .pill.soon { color: var(--muted); font-size: 11px; padding: 3px 8px; min-height: 0; letter-spacing: .08em; text-transform: uppercase; font-family: var(--display); font-weight: 700; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--r-ctl); font-weight: 600; font-size: 16px; border: 1px solid var(--border-strong); background: var(--surface-alt); transition: transform .08s ease, background .15s; }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--gold); color: #1A1400; border-color: var(--gold); }
  .btn.full { width: 100%; min-height: 56px; font-size: 17px; }
  .btn[disabled] { opacity: .45; cursor: default; transform: none; }
  .btn.ghost { border-style: dashed; color: var(--muted); font-weight: 500; }

  /* Quest rows */
  .qrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .qrow:first-child { border-top: 0; padding-top: 4px; }
  .qrow .qname { font-weight: 600; }
  .qrow .qsub { font-size: 13px; color: var(--muted); }
  .qrow .qmeta { margin-left: auto; text-align: right; flex: none; }
  .award { display: inline-flex; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .award b { color: var(--text); font-weight: 600; }
  .award .g { color: var(--gold); }

  /* Pack rows */
  .prow { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); margin-top: 8px; user-select: none; }
  .prow.on { border-color: var(--success); background: var(--surface-alt); }
  .prow .box { width: 30px; height: 30px; flex: none; border-radius: 8px; border: 2px solid var(--border-strong); display: grid; place-items: center; color: transparent; transition: background .12s, border-color .12s; }
  .prow.on .box { background: var(--success); border-color: var(--success); color: #0B1A14; }
  .prow .lbl { font-size: 17px; font-weight: 500; flex: 1; line-height: 1.25; overflow-wrap: anywhere; }
  .prow.on .lbl { color: var(--text); }
  .prow.locked { opacity: .9; }
  .prow input { flex: 1; min-height: 44px; background: transparent; border: 0; border-bottom: 1px dashed var(--border-strong); outline: 0; font-size: 17px; padding: 0 2px; }
  .prow input::placeholder { color: var(--border-strong); }
  .prow input:focus { border-bottom-color: var(--gold); }
  .prow .tag { font-size: 11px; color: var(--muted); font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; flex: none; }
  .banner { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r-card); border: 1px solid var(--success); background: var(--surface-alt); margin-top: 12px; }
  .banner .ic { color: var(--success); }
  .banner .award { color: var(--text); font-size: 14px; }
  .note { font-size: 13px; color: var(--muted); margin: 14px 0 0; line-height: 1.45; }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }
  .empty .ic { color: var(--border-strong); margin-bottom: 8px; }

  /* Tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface-alt); border-top: 1px solid var(--border); display: flex; justify-content: center; z-index: 10; }
  .tabbar .in { display: flex; width: 100%; max-width: 480px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: var(--nav-h); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .tab.active { color: var(--gold); }
  .tab.soon { opacity: .35; pointer-events: none; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px); background: var(--text); color: var(--ground); padding: 10px 16px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); color: #fff; }

  /* Quest rows (live) */
  a.qrow { color: inherit; }
  .qrow .qstate { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-top: 4px; justify-content: flex-end; }
  .qrow .qstate.done { color: var(--success); }
  .qrow .qstate.open { color: var(--gold); }
  .qrow .qstate.wait { color: var(--muted); }
  .qrow .qicon { width: 36px; height: 36px; border-radius: var(--r-ctl); background: var(--surface-alt); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; }
  .qrow.is-done .qicon { color: var(--success); border-color: var(--success); }
  .qrow.is-open .qicon { color: var(--gold); border-color: var(--gold); }
  .qrow.is-off { opacity: .55; }

  /* Check-in screen */
  .stepper { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0 4px; }
  .stepper .sbtn { width: 56px; height: 56px; border-radius: var(--r-ctl); border: 1px solid var(--border-strong); background: var(--surface-alt); font-family: var(--display); font-weight: 700; font-size: 18px; display: grid; place-items: center; }
  .stepper .sbtn:active { transform: scale(.96); }
  .stepper .sval { min-width: 104px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stepper .sval input { width: 104px; text-align: center; background: transparent; border: 0; border-bottom: 2px solid var(--border-strong); font: inherit; color: inherit; outline: 0; padding: 0 0 2px; }
  .stepper .sval input:focus { border-color: var(--gold); }
  .target { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .target b { color: var(--text); }
  .target.met { color: var(--success); }
  .donebtn { width: 100%; min-height: 72px; border-radius: var(--r-hero); border: 2px solid var(--border-strong); background: var(--surface-alt); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 20px; }
  .donebtn.on { border-color: var(--success); color: var(--success); }
  .timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface-alt); }
  .timer .tval { font-family: var(--display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
  .timer.run .tval { color: var(--gold); }
  .timer .tbtns { display: flex; gap: 6px; }
  .pu { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); margin-top: 8px; user-select: none; }
  .pu.on { border-color: var(--gold); background: var(--surface-alt); }
  .pu .box { width: 30px; height: 30px; flex: none; border-radius: 8px; border: 2px solid var(--border-strong); display: grid; place-items: center; color: transparent; }
  .pu.on .box { background: var(--gold); border-color: var(--gold); color: #1A1400; }
  .pu .pl { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .pu .ps { font-size: 13px; color: var(--muted); }
  .pu .pa { margin-left: auto; flex: none; text-align: right; }
  .pu.locked { opacity: .8; }
  .totals { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: var(--ground); padding: 12px 0 8px; margin-top: 16px; border-top: 1px solid var(--border); }
  .totals .line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
  .totals .line b { color: var(--text); font-weight: 600; }
  .totals .line.dim b { color: var(--muted); font-weight: 500; }
  .totals .sum { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 12px; font-family: var(--display); font-weight: 700; font-size: 18px; }
  .totals .sum .award { font-size: 15px; }
  .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--r-ctl); border: 1px solid var(--border-strong); background: var(--surface-alt); font-size: 13px; font-weight: 600; margin-top: 12px; }
  .status-chip.ok { color: var(--success); border-color: var(--success); }

  /* Vault */
  .rw { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .rw:first-child { border-top: 0; padding-top: 2px; }
  .rw .rn { font-weight: 600; font-size: 16px; }
  .rw .rs { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rw .rb { margin-left: auto; flex: none; text-align: right; }
  .rw .rb .btn { min-height: 40px; padding: 0 14px; font-size: 14px; }
  .cost { display: inline-flex; gap: 8px; font-size: 13px; font-weight: 600; }
  .cost .g { color: var(--gold); }
  .goal { padding: 12px 0; border-top: 1px solid var(--border); }
  .goal:first-child { border-top: 0; padding-top: 2px; }
  .goal .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .goal .gn { font-weight: 600; font-size: 16px; }
  .goal .gp { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .goal .bar { margin-top: 8px; height: 10px; }
  .goal.reached .bar > i { background: var(--success); }
  .req { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .req:first-child { border-top: 0; padding-top: 0; }
  .req .rq { font-weight: 600; }
  .req .rs { font-size: 13px; color: var(--muted); }
  .req .rb { margin-left: auto; flex: none; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .field input { width: 100%; min-height: 46px; padding: 8px 12px; border-radius: var(--r-ctl); border: 1px solid var(--border-strong); background: var(--surface-alt); outline: 0; font-size: 16px; }
  .field input:focus { border-color: var(--gold); }
  .approx { font-size: 12px; color: var(--muted); font-weight: 500; }

  /* Log */
  .lday { margin-top: 18px; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .lrow:first-of-type { border-top: 0; }
  .lrow .licon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-alt); border: 1px solid var(--border); color: var(--muted); flex: none; }
  .lrow.earn .licon { color: var(--success); }
  .lrow.spend .licon { color: var(--danger); }
  .lrow.adjust .licon { color: var(--gold); }
  .lrow .ll { font-weight: 500; font-size: 15px; }
  .lrow .ls { font-size: 12px; color: var(--muted); }
  .lrow .la { margin-left: auto; text-align: right; flex: none; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Main">
  <div class="in" id="tabs"></div>
</nav>
<div class="toast" id="toast" role="status"></div>
<script src="/loadout/common.js"></script>
<script>
(function () {
  'use strict';
  const { api, esc, icon, path, go, href, linkify, todayKey, fmtDate, fmtTime } = L;
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  linkify(document.body);

  // ── Toast ─────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2200);
  }

  const sign = n => (n < 0 ? '−' : '+') + Math.abs(n);
  function awardHtml(a, { zeroOk = false, dash = false } = {}) {
    if (!a) return '';
    const parts = [];
    if (a.xp || zeroOk) parts.push('<span><b>' + sign(a.xp) + '</b> XP</span>');
    if (a.coins || zeroOk) parts.push('<span class="g"><b>' + sign(a.coins) + '</b> coins</span>');
    if (a.screenMinutes) parts.push('<span><b>' + sign(a.screenMinutes) + '</b> min</span>');
    if (!parts.length && dash) parts.push('<span>—</span>');
    return '<span class="award">' + parts.join('') + '</span>';
  }
  function addA(a, b) { return { xp: a.xp + b.xp, coins: a.coins + b.coins, screenMinutes: a.screenMinutes + b.screenMinutes }; }
  const ZERO = { xp: 0, coins: 0, screenMinutes: 0 };
  function questTargetLabel(q) {
    if (q.kind === 'externalXp' || q.kind === 'duration') return q.target + ' ' + (q.unitLabel || '');
    if (q.kind === 'count') return 'per ' + (q.unitLabel || 'unit');
    return (q.cadence || 'daily') === 'weekly' ? (q.timesPerWeek || 1) + '× a week' : 'daily';
  }
  // Pure mirror of lib/scoring.checkinAward for the running total on the check-in screen.
  function computeAward(q, powerUpDefs, value, powerUps) {
    let targetMet, base = ZERO;
    if (q.kind === 'externalXp' || q.kind === 'duration') { targetMet = value >= (q.target || 0) && value > 0; if (targetMet) base = { xp: q.xp | 0, coins: q.coins | 0, screenMinutes: q.screenMinutes | 0 }; }
    else if (q.kind === 'count') { const n = Math.max(0, value | 0); targetMet = n > 0; const p = q.perUnit || ZERO; base = { xp: (p.xp | 0) * n, coins: (p.coins | 0) * n, screenMinutes: (p.screenMinutes | 0) * n }; }
    else { targetMet = value > 0; base = targetMet ? { xp: q.xp | 0, coins: q.coins | 0, screenMinutes: q.screenMinutes | 0 } : ZERO; }
    let pu = ZERO;
    for (const id of new Set(powerUps)) { if (!(q.powerUps || []).includes(id)) continue; const d = powerUpDefs.find(p => p.id === id); if (d) pu = addA(pu, { xp: d.xp | 0, coins: d.coins | 0, screenMinutes: d.screenMinutes | 0 }); }
    return { targetMet, base, pu, total: addA(base, pu) };
  }

  function tabbar(active) {
    const items = [
      ['/', 'home', 'Today'], ['/pack', 'bag', 'Pack'], ['/vault', 'vault', 'Vault'], ['/log', 'log', 'Log'],
    ];
    tabs.innerHTML = items.map(([p, ic, label, soon]) =>
      '<a class="tab' + (p === active ? ' active' : '') + (soon ? ' soon' : '') + '" href="' + href(p) + '" data-link' +
      (soon ? ' aria-disabled="true"' : '') + '>' + icon(ic, 22) + '<span>' + label + '</span></a>').join('');
  }

  // ── Today ─────────────────────────────────────────────────────────
  async function renderToday() {
    tabbar('/');
    app.innerHTML = '<div class="top"><span class="brand">Loadout</span></div><p class="muted">Loading…</p>';
    let t;
    try { t = await api('/today'); } catch (e) { app.innerHTML = errorView(e); return; }
    const b = t.balances, lv = t.level, pc = t.day.packCheck;
    const pct = Math.round(100 * lv.into / lv.perLevel);

    let packCard;
    const items = pc ? pc.items : [];
    const ticked = items.filter(i => i.checked).length;
    if (pc && pc.submittedAt) {
      const v = pc.verification;
      packCard = '<a class="card hero done" href="' + href('/pack') + '" data-link><div class="row"><div class="icon-wrap">' + icon('check', 22) + '</div><div>' +
        '<div class="eyebrow" style="color:var(--success)">Packed ' + fmtTime(pc.submittedAt) + '</div><h2>Pack check done</h2>' +
        '<p>' + ticked + ' of ' + items.length + ' ticked · ' + awardHtml(pc.awarded) + '</p>' +
        '<p style="margin-top:6px">' + (v ? 'Bag checked: ' + v.arrived.length + ' arrived' + (v.missing.length ? ', ' + v.missing.length + ' missing' : '') : 'Waiting for a parent to check the bag') + '</p>' +
        '</div></div></a>';
    } else if (items.length) {
      packCard = '<a class="card hero" href="' + href('/pack') + '" data-link><div class="row"><div class="icon-wrap">' + icon('bag', 22) + '</div><div style="flex:1">' +
        '<div class="eyebrow gold">Pack check</div><h2>' + items.length + ' thing' + (items.length === 1 ? '' : 's') + ' on today\'s slip</h2>' +
        '<p>Fill it in from your slip when you get home.</p>' +
        '<div style="margin-top:14px"><span class="btn primary" style="min-height:44px">Open pack check ' + icon('right', 18) + '</span></div>' +
        '</div></div></a>';
    } else if (t.isSchoolDay) {
      packCard = '<div class="card"><div class="row" style="display:flex;gap:12px;align-items:center"><span class="muted">' + icon('bag', 22) + '</span><div><b>No slip written yet</b><div class="muted" style="font-size:13px">Ask a parent to write today\'s list — or add your own items on the Pack tab.</div></div></div></div>';
    } else {
      packCard = '<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="muted">' + icon('bag', 22) + '</span><div><b>No pack check today</b><div class="muted" style="font-size:13px">School days only. Enjoy the weekend.</div></div></div></div>';
    }

    const quests = t.quests.filter(q => q.kind !== 'packCheck');
    const doneCount = quests.filter(q => { const c = t.day.checkins.find(x => x.questId === q.id); return c && c.targetMet; }).length;
    const questRows = quests.length ? quests.map(q => {
      const c = t.day.checkins.find(x => x.questId === q.id);
      const weekly = (q.cadence || 'daily') === 'weekly';
      const wc = weekly ? (t.weekCounts[q.id] || 0) : 0;
      const weekDone = weekly && !c && wc >= (q.timesPerWeek || 1);
      let cls = '', state, ic = 'sword';
      if (c && c.status === 'pending') { cls = 'is-open'; ic = 'lock'; state = '<div class="qstate wait">' + icon('lock', 13) + 'Waiting for a parent</div>'; }
      else if (c && c.targetMet) { cls = 'is-done'; ic = 'check'; state = '<div class="qstate done">' + icon('check', 13) + 'Done' + (weekly ? ' · ' + wc + ' of ' + (q.timesPerWeek || 1) + ' this week' : '') + '</div>'; }
      else if (c) { cls = 'is-open'; ic = 'right'; state = '<div class="qstate open">' + c.value + ' / ' + q.target + ' · keep going</div>'; }
      else if (weekDone) { cls = 'is-off'; ic = 'check'; state = '<div class="qstate done">' + icon('check', 13) + wc + ' of ' + (q.timesPerWeek || 1) + ' this week</div>'; }
      else { state = '<div class="qstate wait">' + (weekly ? wc + ' of ' + (q.timesPerWeek || 1) + ' this week' : 'Not logged') + '</div>'; }
      const a = c && c.awarded && (c.awarded.xp || c.awarded.coins) ? c.awarded : (q.kind === 'count' ? q.perUnit : q);
      return '<a class="qrow ' + cls + '" href="' + href('/quest/' + encodeURIComponent(q.id)) + '" data-link><div class="qicon">' + icon(ic, 18) + '</div><div><div class="qname">' + esc(q.name) + '</div><div class="qsub">' + esc(questTargetLabel(q)) + '</div></div>' +
        '<div class="qmeta">' + awardHtml(a) + state + '</div></a>';
    }).join('') : '<div class="muted" style="font-size:14px">Nothing else on the board today.</div>';

    app.innerHTML =
      '<div class="top"><span class="brand">Loadout</span><span class="date">' + fmtDate(t.date) + '</span></div>' +
      '<div class="level"><div><div class="eyebrow">Level ' + lv.level + '</div><h1>' + esc(t.child.name) + '</h1></div>' +
      '<span class="pill' + (t.streak > 0 ? ' hot' : '') + '">' + icon('flame', 18) + ' <span class="num">' + t.streak + '</span> day streak</span></div>' +
      '<div class="bar" role="progressbar" aria-valuenow="' + lv.into + '" aria-valuemax="' + lv.perLevel + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="muted" style="font-size:12px;margin-top:6px;display:flex;justify-content:space-between"><span>' + lv.into + ' / ' + lv.perLevel + ' XP</span><span>Level ' + (lv.level + 1) + ' at ' + lv.next + ' XP</span></div>' +
      '<div class="strip">' +
        '<div class="tile"><div class="lbl">' + icon('bolt', 16) + 'XP</div><div class="val num">' + b.xp.toLocaleString() + '</div></div>' +
        '<div class="tile gold"><div class="lbl">' + icon('coin', 16) + 'Coins</div><div class="val num">' + b.coins.toLocaleString() + '</div></div>' +
        '<div class="tile"><div class="lbl">' + icon('screen', 16) + 'Screen</div><div class="val num">' + b.screenMinutes + '<small>min</small></div></div>' +
      '</div>' +
      packCard +
      '<div class="section"><div class="section-h"><h2>Today\'s quests</h2><span class="muted" style="font-size:12px">' + doneCount + ' of ' + quests.length + ' done</span></div><div class="card">' + questRows + '</div></div>';
  }

  // ── Pack check ────────────────────────────────────────────────────
  let packDay = null;     // day record for today
  let packMode = 'paper'; // 'paper' = ticks happen on a printed slip, entered at home
  let pending = new Set(); // itemIds with an in-flight tick
  const BLANKS = 2;

  async function renderPack() {
    tabbar('/pack');
    const date = todayKey();
    app.innerHTML = '<div class="top"><a class="back" href="' + href('/') + '" data-link>' + icon('left', 20) + 'Today</a><span class="date">' + fmtDate(date) + '</span></div><p class="muted">Loading…</p>';
    try { const t = await api('/today'); packDay = t.day; packMode = t.packMode || 'paper'; } catch (e) { app.innerHTML = errorView(e); return; }
    paintPack();
  }

  function itemRow(i, locked) {
    return '<div class="prow' + (i.checked ? ' on' : '') + (locked ? ' locked' : '') + '" role="checkbox" aria-checked="' + !!i.checked + '" tabindex="0" data-tick="' + esc(i.id) + '">' +
      '<span class="box">' + icon('check', 18) + '</span><span class="lbl">' + esc(i.label) + '</span>' + (i.source === 'child' ? '<span class="tag">Mine</span>' : '') + '</div>';
  }

  function blankRow(n) {
    return '<div class="prow" data-blank="' + n + '"><button class="box" type="button" aria-label="Tick and add" data-blank-tick="' + n + '">' + icon('check', 18) + '</button>' +
      '<input type="text" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="Something that came up…" maxlength="120" data-blank-input="' + n + '"></div>';
  }

  function paintPack() {
    const pc = packDay.packCheck;
    const items = pc ? pc.items : [];
    const parentItems = items.filter(i => i.source === 'parent');
    const childItems = items.filter(i => i.source === 'child');
    const locked = !!(pc && pc.submittedAt);
    const ticked = items.filter(i => i.checked).length;
    const date = packDay.date;

    let head;
    if (locked) {
      const v = pc.verification;
      head = '<div class="banner">' + icon('check', 26) + '<div><div style="font-weight:600">Packed · ' + ticked + ' of ' + items.length + ' ticked</div>' +
        '<div class="award">' + (pc.awarded ? awardHtml(pc.awarded) : '') + '</div>' +
        '<div class="muted" style="font-size:13px;margin-top:4px">' + (v ? 'Bag checked: ' + v.arrived.length + ' arrived' + (v.missing.length ? ', ' + v.missing.length + ' missing' : '') + (v.note ? ' — ' + esc(v.note) : '') : 'A parent will check the bag tonight.') + '</div></div></div>';
    } else {
      head = '<h1>Pack check</h1><p class="muted" style="margin:4px 0 0;font-size:15px">' + (packMode === 'phone' ? 'At your locker: tick each thing as it goes in the bag.' : 'Fill this in from your slip when you get home. Tick what you actually packed.') + '</p>';
    }

    const fromMorning = parentItems.length
      ? parentItems.map(i => itemRow(i, locked)).join('')
      : '<div class="empty">' + icon('bag', 28) + '<div>No slip from this morning.</div></div>';

    const blanks = locked ? '' : Array.from({ length: BLANKS }, (_, n) => blankRow(n)).join('') +
      '<button class="btn ghost full" type="button" style="min-height:48px;margin-top:8px" data-add-line>' + icon('plus', 18) + ' Add one more line</button>';

    app.innerHTML =
      '<div class="top"><a class="back" href="' + href('/') + '" data-link>' + icon('left', 20) + 'Today</a><span class="date">' + fmtDate(date) + '</span></div>' +
      head +
      '<div class="section"><div class="eyebrow">From this morning</div>' + fromMorning + '</div>' +
      '<div class="section"><div class="eyebrow">Came up today</div>' + childItems.map(i => itemRow(i, locked)).join('') + blanks + '</div>' +
      (locked ? '' :
        '<div class="section"><button class="btn primary full" type="button" data-submit' + (ticked === 0 ? ' disabled' : '') + '>' + icon('lock', 20) + ' Packed — lock it in</button>' +
        '<p class="note">' + (ticked ? ticked + ' ticked. ' : 'Tick at least one thing to submit. ') + 'Submitting pays the pack-check award whether you got 3 of 5 or 5 of 5 — a parent checks the bag separately.</p></div>') +
      '<p class="note" style="text-align:center">' + (packMode === 'phone' ? 'Do this at your locker, not at your desk. Under 90 seconds.' : 'Ticks happen on the paper slip at your locker. This screen is for entering them at home.') + '</p>';
  }

  async function tick(id) {
    const pc = packDay.packCheck;
    if (!pc || pc.submittedAt || pending.has(id)) return;
    const item = pc.items.find(i => i.id === id);
    if (!item) return;
    const next = !item.checked;
    item.checked = next; pending.add(id); paintPack();
    try {
      packDay = await api('/day/' + packDay.date + '/pack/tick', { method: 'POST', body: { itemId: id, checked: next } });
    } catch (e) {
      item.checked = !next; toast(e.status === 409 ? 'Already submitted' : 'Could not save', true);
      if (e.status === 409 && e.data && e.data.day) packDay = e.data.day;
    } finally { pending.delete(id); paintPack(); }
  }

  async function addBlank(n, checked) {
    const input = app.querySelector('[data-blank-input="' + n + '"]');
    if (!input || input.disabled) return;
    const label = input.value.trim();
    if (!label) { input.focus(); return; }
    input.disabled = true;
    try {
      const r = await api('/day/' + packDay.date + '/pack/items/add', { method: 'POST', body: { label, checked } });
      packDay = r.day; paintPack();
    } catch (e) {
      input.disabled = false; toast(e.status === 409 ? 'Already submitted' : 'Could not add', true);
      if (e.status === 409 && e.data && e.data.day) { packDay = e.data.day; paintPack(); }
    }
  }

  async function submit() {
    const btn = app.querySelector('[data-submit]');
    if (btn) btn.disabled = true;
    try {
      const r = await api('/day/' + packDay.date + '/pack/submit', { method: 'POST' });
      packDay = r.day; paintPack();
      if (!r.already && r.awarded) toast('+' + r.awarded.xp + ' XP · +' + r.awarded.coins + ' coins');
    } catch (e) { toast(e.message || 'Could not submit', true); if (btn) btn.disabled = false; }
  }

  L.on(app, 'click', '[data-tick]', (e, row) => tick(row.dataset.tick));
  L.on(app, 'keydown', '[data-tick]', (e, row) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tick(row.dataset.tick); } });
  // pointerdown lands before the input's focusout, so the blur-save below
  // knows to stand aside and let the click add the item as ticked.
  let tickingBlank = null;
  L.on(app, 'pointerdown', '[data-blank-tick]', (e, b) => { tickingBlank = b.dataset.blankTick; });
  L.on(app, 'click', '[data-blank-tick]', (e, b) => { tickingBlank = null; addBlank(b.dataset.blankTick, true); });
  L.on(app, 'keydown', '[data-blank-input]', (e, inp) => { if (e.key === 'Enter') { e.preventDefault(); addBlank(inp.dataset.blankInput, false); } });
  L.on(app, 'click', '[data-add-line]', (e, b) => {
    const n = app.querySelectorAll('[data-blank]').length;
    b.insertAdjacentHTML('beforebegin', blankRow(n));
    app.querySelector('[data-blank-input="' + n + '"]').focus();
  });
  L.on(app, 'click', '[data-submit]', submit);
  // Save a typed-but-unsubmitted line when the input loses focus.
  app.addEventListener('focusout', e => {
    const inp = e.target.closest && e.target.closest('[data-blank-input]');
    if (!inp || inp.disabled || !inp.value.trim()) return;
    if (tickingBlank === inp.dataset.blankInput) return;
    addBlank(inp.dataset.blankInput, false);
  });

  // ── Quest check-in ───────────────────────────────────────────────
  const timerKey = (qid, date) => 'loadout.timer.' + qid + '.' + date;
  function readTimer(qid, date) { try { return JSON.parse(localStorage.getItem(timerKey(qid, date))) || { acc: 0, startedAt: null }; } catch (e) { return { acc: 0, startedAt: null }; } }
  function writeTimer(qid, date, t) { try { localStorage.setItem(timerKey(qid, date), JSON.stringify(t)); } catch (e) {} }
  function timerMs(t) { return t.acc + (t.startedAt ? Date.now() - t.startedAt : 0); }
  function fmtMs(ms) { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  let timerTick = null;

  async function renderQuest(qid) {
    tabbar('/');
    app.innerHTML = '<div class="top"><a class="back" href="' + href('/') + '" data-link>' + icon('left', 20) + 'Today</a></div><p class="muted">Loading…</p>';
    let t;
    try { t = await api('/today'); } catch (e) { app.innerHTML = errorView(e); return; }
    const q = t.quests.find(x => x.id === qid);
    if (!q || q.kind === 'packCheck') {
      app.innerHTML = '<div class="top"><a class="back" href="' + href('/') + '" data-link>' + icon('left', 20) + 'Today</a></div><div class="empty">' + icon('sword', 28) + '<div><b>Not on the board today</b><br><span style="font-size:13px">This quest isn\'t active on ' + esc(L.DAY_LONG[t.weekday]) + 's.</span></div></div>';
      return;
    }
    const date = t.date;
    const existing = t.day.checkins.find(x => x.questId === q.id) || null;
    const locked = !!existing && (existing.status === 'adjusted' || (q.requiresParentConfirm && existing.status === 'confirmed'));
    const weekly = (q.cadence || 'daily') === 'weekly';
    const weekDone = weekly && !existing && (t.weekCounts[q.id] || 0) >= (q.timesPerWeek || 1);
    const st = {
      value: existing ? existing.value : 0,
      powerUps: new Set(existing ? existing.powerUps : []),
      paidPowerUps: new Set(existing && existing.status !== 'pending' ? existing.powerUps : []),
      focus: existing ? existing.focusMinutes || 0 : 0,
      saving: false,
    };
    const minValue = existing && existing.status !== 'pending' ? existing.value : 0; // monotonic: can't go below what was paid for
    const hasTimer = q.kind === 'duration' || q.kind === 'externalXp';
    const step = q.kind === 'externalXp' ? [1, 5] : q.kind === 'duration' ? [5, 10] : [1, 5];

    function paint() {
      const a = computeAward(q, t.powerUps, st.value, [...st.powerUps]);
      const tm = readTimer(q.id, date);
      let entry;
      if (q.kind === 'simple') {
        entry = '<button class="donebtn' + (st.value ? ' on' : '') + '" type="button" data-toggle-done' + (locked ? ' disabled' : '') + '>' + icon('check', 24) + (st.value ? 'Done' : 'Mark done') + '</button>';
      } else {
        entry = '<div class="stepper">' +
          '<button class="sbtn" type="button" data-step="-' + step[1] + '"' + (locked ? ' disabled' : '') + '>−' + step[1] + '</button>' +
          '<button class="sbtn" type="button" data-step="-' + step[0] + '"' + (locked ? ' disabled' : '') + '>−' + step[0] + '</button>' +
          '<div class="sval"><input type="number" inputmode="numeric" min="0" value="' + st.value + '" data-val' + (locked ? ' disabled' : '') + '></div>' +
          '<button class="sbtn" type="button" data-step="' + step[0] + '"' + (locked ? ' disabled' : '') + '>+' + step[0] + '</button>' +
          '<button class="sbtn" type="button" data-step="' + step[1] + '"' + (locked ? ' disabled' : '') + '>+' + step[1] + '</button></div>' +
          (q.kind === 'count'
            ? '<div class="target">' + esc(q.unitLabel || 'units') + ' · ' + awardHtml(q.perUnit) + ' each</div>'
            : '<div class="target' + (a.targetMet ? ' met' : '') + '">' + (a.targetMet ? icon('check', 14) + ' Target reached' : 'Target <b>' + q.target + '</b> ' + esc(q.unitLabel || '') + (st.value > 0 ? ' · ' + (q.target - st.value) + ' to go' : '')) + '</div>');
        if (hasTimer && !locked) {
          const running = !!tm.startedAt;
          entry += '<div class="timer' + (running ? ' run' : '') + '"><div><div class="eyebrow">Focus timer</div><div class="tval" data-tval>' + fmtMs(timerMs(tm)) + '</div></div><div class="tbtns">' +
            (running ? '<button class="btn" type="button" data-timer="stop">Stop</button>'
              : '<button class="btn" type="button" data-timer="start">' + (tm.acc ? 'Resume' : 'Start') + '</button>' +
                (tm.acc >= 60000 ? '<button class="btn primary" type="button" data-timer="use">' + (q.kind === 'duration' ? 'Use ' + Math.round(tm.acc / 60000) + ' min' : 'Save ' + Math.round(tm.acc / 60000) + ' min focus') + '</button>' : '')) +
            '</div></div>';
        }
      }
      const pus = (q.powerUps || []).map(id => t.powerUps.find(p => p.id === id)).filter(Boolean);
      const puHtml = pus.length ? '<div class="section"><div class="eyebrow">Power-ups</div><p class="note" style="margin:4px 0 6px">These pay for how you worked, even if you didn\'t hit the target.</p>' +
        pus.map(p => { const on = st.powerUps.has(p.id); const lk = locked || st.paidPowerUps.has(p.id);
          return '<div class="pu' + (on ? ' on' : '') + (lk ? ' locked' : '') + '" role="checkbox" aria-checked="' + on + '" tabindex="0" data-pu="' + esc(p.id) + '"><span class="box">' + icon('check', 18) + '</span><div><div class="pl">' + esc(p.label) + '</div><div class="ps">' + esc(p.sub || '') + '</div></div><div class="pa">' + awardHtml(p) + '</div></div>'; }).join('') + '</div>' : '';

      let status = '';
      if (existing && existing.status === 'pending') status = '<div class="status-chip">' + icon('lock', 14) + ' Logged — waiting for a parent to confirm</div>';
      else if (existing && existing.status === 'adjusted') status = '<div class="status-chip">' + icon('lock', 14) + ' Adjusted by a parent' + (existing.note ? ': ' + esc(existing.note) : '') + '</div>';
      else if (existing && existing.status === 'confirmed' && locked) status = '<div class="status-chip ok">' + icon('check', 14) + ' Confirmed by a parent</div>';
      else if (existing && existing.paid && (existing.paid.xp || existing.paid.coins)) status = '<div class="status-chip ok">' + icon('check', 14) + ' Paid so far: ' + awardHtml(existing.paid) + '</div>';

      const paid = existing && existing.status !== 'pending' ? existing.paid : ZERO;
      const delta = addA(a.total, { xp: -paid.xp, coins: -paid.coins, screenMinutes: -paid.screenMinutes });
      const changed = !existing || st.value !== existing.value || [...st.powerUps].sort().join() !== [...existing.powerUps].sort().join() || st.focus !== (existing.focusMinutes || 0);
      const totals = locked ? '' : '<div class="totals">' +
        '<div class="line' + (a.targetMet ? '' : ' dim') + '"><span>' + esc(q.name) + (a.targetMet ? '' : (q.kind === 'simple' ? ' (not done)' : ' (below target)')) + '</span><b>' + (a.targetMet || q.kind === 'count' ? awardHtml(a.base, { dash: true }) : '—') + '</b></div>' +
        (pus.length ? '<div class="line"><span>Power-ups</span><b>' + awardHtml(a.pu, { dash: true }) + '</b></div>' : '') +
        '<div class="sum"><span>' + (existing ? 'New since last log' : 'Total') + '</span>' + awardHtml(existing ? delta : a.total, { dash: true }) + '</div>' +
        '<button class="btn primary full" type="button" data-log' + (st.saving || !changed || (q.kind !== 'count' && q.kind !== 'simple' && st.value === 0 && !st.powerUps.size) || (q.kind === 'simple' && !st.value) ? ' disabled' : '') + '>' +
          (q.requiresParentConfirm ? icon('lock', 18) + ' Log for a parent to confirm' : icon('bolt', 18) + ' Log it') + '</button>' +
        (weekDone ? '<p class="note" style="text-align:center">Already done ' + (q.timesPerWeek || 1) + '× this week.</p>' : '') + '</div>';

      app.innerHTML =
        '<div class="top"><a class="back" href="' + href('/') + '" data-link>' + icon('left', 20) + 'Today</a><span class="date">' + fmtDate(date) + '</span></div>' +
        '<div class="eyebrow gold">Quest</div><h1>' + esc(q.name) + '</h1>' +
        '<p class="muted" style="margin:4px 0 12px;font-size:14px">' + esc(questTargetLabel(q)) + (q.kind !== 'count' ? ' · ' + awardHtml(q) : '') + (q.requiresParentConfirm ? ' · parent confirms' : '') + '</p>' +
        '<div class="card">' + entry + '</div>' + status + puHtml + totals;
      clearInterval(timerTick);
      if (tm.startedAt) timerTick = setInterval(() => { const el = app.querySelector('[data-tval]'); if (el) el.textContent = fmtMs(timerMs(readTimer(q.id, date))); else clearInterval(timerTick); }, 1000);
    }

    function setValue(v) { st.value = Math.max(minValue, Math.min(100000, Math.round(Number(v) || 0))); paint(); }
    // The module-level handlers below dispatch to whichever quest is on screen.
    questCtl = {
      step(n) { setValue(st.value + n); },
      set(v) { setValue(v); },
      toggleDone() { if (!locked) { st.value = st.value ? 0 : 1; if (st.value < minValue) st.value = minValue; paint(); } },
      powerUp(id) { if (locked || st.paidPowerUps.has(id)) { if (st.paidPowerUps.has(id)) toast('Already paid — ask a parent to change it'); return; } st.powerUps.has(id) ? st.powerUps.delete(id) : st.powerUps.add(id); paint(); },
      timer(action) {
        const tm = readTimer(q.id, date);
        if (action === 'start') { tm.startedAt = Date.now(); writeTimer(q.id, date, tm); }
        if (action === 'stop') { tm.acc = timerMs(tm); tm.startedAt = null; writeTimer(q.id, date, tm); }
        if (action === 'use') { const mins = Math.round(tm.acc / 60000); st.focus = mins; if (q.kind === 'duration') st.value = Math.max(st.value, mins, minValue); toast(q.kind === 'duration' ? mins + ' min from the timer' : mins + ' focus minutes saved'); }
        paint();
      },
      async log(btn) {
        st.saving = true; btn.disabled = true;
        try {
          const r = await api('/day/' + date + '/checkin', { method: 'POST', body: { questId: q.id, value: st.value, focusMinutes: st.focus, powerUps: [...st.powerUps] } });
          if (r.pending) toast('Logged — a parent will confirm');
          else if (r.paid && (r.paid.xp || r.paid.coins || r.paid.screenMinutes)) toast(['+' + r.paid.xp + ' XP', '+' + r.paid.coins + ' coins', r.paid.screenMinutes ? '+' + r.paid.screenMinutes + ' min' : ''].filter(Boolean).join(' · '));
          else toast('Logged');
          if (r.checkin.targetMet) { try { localStorage.removeItem(timerKey(q.id, date)); } catch (x) {} }
          go('/');
        } catch (err) { st.saving = false; toast(err.message || 'Could not log', true); paint(); }
      },
    };
    paint();
  }
  let questCtl = null;
  L.on(app, 'click', '[data-step]', (e, b) => questCtl && questCtl.step(Number(b.dataset.step)));
  L.on(app, 'change', '[data-val]', (e, inp) => questCtl && questCtl.set(inp.value));
  L.on(app, 'keydown', '[data-val]', (e, inp) => { if (e.key === 'Enter') inp.blur(); });
  L.on(app, 'click', '[data-toggle-done]', () => questCtl && questCtl.toggleDone());
  L.on(app, 'click', '[data-pu]', (e, el) => questCtl && questCtl.powerUp(el.dataset.pu));
  L.on(app, 'keydown', '[data-pu]', (e, el) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); el.click(); } });
  L.on(app, 'click', '[data-timer]', (e, b) => questCtl && questCtl.timer(b.dataset.timer));
  L.on(app, 'click', '[data-log]', (e, b) => questCtl && questCtl.log(b));

  // ── Vault ────────────────────────────────────────────────────────
  let vaultSuggesting = false;
  function costHtml(c) {
    const p = [];
    if (c.coins) p.push('<span class="g">' + c.coins.toLocaleString() + ' coins</span>');
    if (c.screenMinutes) p.push('<span>' + c.screenMinutes + ' min</span>');
    return '<span class="cost">' + (p.join('') || '<span>free</span>') + '</span>';
  }
  async function renderVault() {
    tabbar('/vault');
    app.innerHTML = '<div class="top"><span class="brand">Loadout</span></div><h1>Vault</h1><p class="muted">Loading…</p>';
    let v;
    try { v = await api('/vault'); } catch (e) { app.innerHTML = errorView(e); return; }
    paintVault(v);
  }
  function paintVault(v) {
    const b = v.balances, cv = v.coinValue || {};
    const approx = cv.perCoin > 0 ? '<div class="approx">≈ ' + esc(cv.currency || '') + ' ' + (b.coins * cv.perCoin).toLocaleString() + '</div>' : '';
    const reserved = v.reserved.coins || v.reserved.screenMinutes;
    const open = v.open.filter(r => r.status === 'open');
    const rewards = v.rewards.filter(r => !r.savingsGoal);
    const goals = v.rewards.filter(r => r.savingsGoal);
    const rewardRow = r => {
      const need = Math.max(0, r.cost.coins - v.available.coins);
      const needMin = Math.max(0, r.cost.screenMinutes - v.available.screenMinutes);
      let btn;
      if (r.pending) btn = '<span class="pill">' + icon('lock', 14) + ' Requested</span>';
      else if (r.affordable) btn = '<button class="btn primary" type="button" data-redeem="' + esc(r.id) + '">Redeem</button>';
      else btn = '<span class="muted" style="font-size:12px">' + (need ? need.toLocaleString() + ' more coins' : needMin + ' more min') + '</span>';
      return '<div class="rw"><div><div class="rn">' + esc(r.name) + '</div><div class="rs">' + costHtml(r.cost) + (r.note ? ' · ' + esc(r.note) : '') + '</div></div><div class="rb">' + btn + '</div></div>';
    };
    const goalRow = r => {
      const pct = Math.min(100, Math.round(100 * b.coins / Math.max(1, r.cost.coins)));
      const reached = b.coins >= r.cost.coins;
      return '<div class="goal' + (reached ? ' reached' : '') + '"><div class="gh"><div class="gn">' + esc(r.name) + '</div><div class="gp">' + b.coins.toLocaleString() + ' / ' + r.cost.coins.toLocaleString() + '</div></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="gh" style="margin-top:6px"><span class="muted" style="font-size:12px">' + (reached ? 'Saved up!' : (r.cost.coins - b.coins).toLocaleString() + ' to go') + '</span>' +
        (reached ? (r.pending ? '<span class="pill">' + icon('lock', 14) + ' Requested</span>' : (r.affordable ? '<button class="btn primary" type="button" data-redeem="' + esc(r.id) + '" style="min-height:40px">Redeem</button>' : '<span class="muted" style="font-size:12px">coins spoken for</span>')) : '') + '</div></div>';
    };
    const suggest = vaultSuggesting
      ? '<div class="card"><div class="eyebrow">Suggest a reward</div><form id="suggest"><div class="field"><label>What is it?</label><input type="text" name="name" maxlength="120" placeholder="e.g. Trip to the climbing gym" required></div>' +
        '<div class="field"><label>What should it cost? (coins, optional)</label><input type="number" name="coins" inputmode="numeric" min="0" placeholder="Parents decide"></div>' +
        '<div class="field"><label>Why? (optional)</label><input type="text" name="why" maxlength="300"></div>' +
        '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" type="submit" style="flex:1">Send to parents</button><button class="btn" type="button" data-suggest-cancel>Cancel</button></div></form></div>'
      : '<button class="btn ghost full" type="button" data-suggest>' + icon('plus', 18) + ' Suggest a reward</button>';
    const recent = v.recent.map(r => '<div class="req"><div><div class="rq">' + esc(r.name) + '</div><div class="rs">' + esc(L.relDay(r.resolvedAt ? r.resolvedAt.slice(0, 10) : r.requestedAt.slice(0, 10))) + (r.note && r.status !== 'cancelled' ? ' · ' + esc(r.note) : '') + '</div></div>' +
      '<div class="rb"><span class="pill' + (r.status === 'approved' ? ' hot' : '') + '" style="font-size:12px">' + (r.status === 'approved' ? (r.kind === 'suggest' ? 'Added' : 'Approved') : r.status === 'denied' ? 'Denied' : 'Cancelled') + '</span></div></div>').join('');

    app.innerHTML =
      '<div class="top"><span class="brand">Loadout</span></div><h1>Vault</h1>' +
      '<div class="strip" style="grid-template-columns:1fr 1fr">' +
        '<div class="tile gold"><div class="lbl">' + icon('coin', 16) + 'Coins</div><div class="val num">' + b.coins.toLocaleString() + '</div>' + approx + '</div>' +
        '<div class="tile"><div class="lbl">' + icon('screen', 16) + 'Screen time</div><div class="val num">' + b.screenMinutes + '<small>min</small></div></div></div>' +
      (reserved ? '<p class="note" style="margin:-4px 0 12px">' + [v.reserved.coins ? v.reserved.coins + ' coins' : '', v.reserved.screenMinutes ? v.reserved.screenMinutes + ' min' : ''].filter(Boolean).join(' and ') + ' spoken for by requests below.</p>' : '') +
      (open.length ? '<div class="card" style="border-color:var(--gold)"><div class="eyebrow gold" style="margin-bottom:6px">Waiting for a parent</div>' + open.map(r => '<div class="req"><div><div class="rq">' + esc(r.name) + '</div><div class="rs">' + (r.kind === 'suggest' ? 'Suggestion' : costHtml(r.cost)) + ' · ' + esc(L.relDay(r.requestedAt.slice(0, 10))) + '</div></div><div class="rb"><button class="btn" type="button" data-cancel-req="' + esc(r.id) + '" style="min-height:36px;font-size:13px">Cancel</button></div></div>').join('') + '</div>' : '') +
      '<div class="section"><div class="section-h"><h2>Rewards</h2></div><div class="card">' + (rewards.length ? rewards.map(rewardRow).join('') : '<div class="muted" style="font-size:14px">No rewards set up yet.</div>') + '</div></div>' +
      (goals.length ? '<div class="section"><div class="section-h"><h2>Saving up for</h2></div><div class="card">' + goals.map(goalRow).join('') + '</div></div>' : '') +
      '<div class="section">' + suggest + '</div>' +
      (recent.length ? '<div class="section"><div class="section-h"><h2>Recent</h2></div><div class="card">' + recent + '</div></div>' : '') +
      '<p class="note" style="text-align:center">Redeeming asks a parent. Coins only leave the vault when they say yes.</p>';
  }
  L.on(app, 'click', '[data-redeem]', async (e, b) => {
    b.disabled = true;
    try { const r = await api('/rewards/' + b.dataset.redeem + '/request', { method: 'POST' }); toast('Sent to your parents'); paintVault(r.vault); }
    catch (err) { b.disabled = false; toast(err.message, true); }
  });
  L.on(app, 'click', '[data-cancel-req]', async (e, b) => {
    b.disabled = true;
    try { const r = await api('/requests/' + b.dataset.cancelReq + '/cancel', { method: 'POST' }); toast('Cancelled'); paintVault(r.vault); }
    catch (err) { b.disabled = false; toast(err.message, true); }
  });
  L.on(app, 'click', '[data-suggest]', () => { vaultSuggesting = true; renderVault(); });
  L.on(app, 'click', '[data-suggest-cancel]', () => { vaultSuggesting = false; renderVault(); });
  L.on(app, 'submit', '#suggest', async (e, f) => {
    e.preventDefault();
    try { const r = await api('/requests/suggest', { method: 'POST', body: { name: f.name.value, coins: f.coins.value, why: f.why.value } }); vaultSuggesting = false; toast('Suggestion sent'); paintVault(r.vault); }
    catch (err) { toast(err.message, true); }
  });

  // ── Log ──────────────────────────────────────────────────────────
  async function renderLog() {
    tabbar('/log');
    app.innerHTML = '<div class="top"><span class="brand">Loadout</span></div><h1>Log</h1><p class="muted">Loading…</p>';
    let entries, cfg;
    try { [entries, cfg] = await Promise.all([api('/ledger?limit=150'), api('/config')]); } catch (e) { app.innerHTML = errorView(e); return; }
    const qname = id => { const q = (cfg.quests || []).find(x => x.id === id); return q ? q.name : id; };
    const groups = new Map();
    for (const e of entries) { const k = e.at.slice(0, 10); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
    const label = e => {
      const s = e.source || {};
      if (s.type === 'packCheck') return ['Pack check', 'bag'];
      if (s.type === 'checkin') return [qname(s.questId), 'sword'];
      if (s.type === 'checkin-adjust') return [qname(s.questId) + ' · adjusted', 'settings'];
      if (s.type === 'legacy-import') return ['Starting balance', 'star'];
      if (s.type === 'reward') return [s.name || 'Reward', 'vault'];
      return [e.note || e.kind, 'log'];
    };
    let html = '<div class="top"><span class="brand">Loadout</span></div><h1>Log</h1><p class="muted" style="margin:4px 0 0;font-size:14px">Everything you\'ve earned and spent.</p>';
    if (!groups.size) html += '<div class="empty">' + icon('log', 28) + '<div>Nothing yet.</div></div>';
    for (const [day, list] of groups) {
      html += '<div class="lday"><div class="eyebrow">' + esc(L.relDay(day)) + '</div><div class="card" style="margin-top:6px">' + list.map(e => {
        const [l, ic] = label(e);
        const sub = e.source && e.source.type === 'legacy-import' ? 'Carried over from the old chore tracker' : (e.kind === 'adjust' ? e.note : fmtTime(e.at));
        return '<div class="lrow ' + e.kind + '"><div class="licon">' + icon(ic, 16) + '</div><div><div class="ll">' + esc(l) + '</div><div class="ls">' + esc(sub) + '</div></div><div class="la">' + awardHtml(e, { dash: true }) + '</div></div>';
      }).join('') + '</div></div>';
    }
    app.innerHTML = html;
  }

  function errorView(e) {
    return '<div class="empty">' + icon('alert', 28) + '<div><b>Could not load</b><br><span style="font-size:13px">' + esc(e.message) + '</span></div><div style="margin-top:14px"><button class="btn" type="button" onclick="location.reload()">Try again</button></div></div>';
  }

  function soonView(name) {
    tabbar(path());
    app.innerHTML = '<div class="top"><a class="back" href="' + href('/') + '" data-link>' + icon('left', 20) + 'Today</a></div><div class="empty">' + icon('lock', 28) + '<div><b>' + esc(name) + '</b><br><span style="font-size:13px">Opens in a later update.</span></div></div>';
  }

  function route() {
    const p = path();
    clearInterval(timerTick);
    questCtl = null;
    window.scrollTo(0, 0);
    if (p === '/') return renderToday();
    if (p === '/pack') return renderPack();
    if (p === '/vault') return renderVault();
    if (p === '/log') return renderLog();
    const qm = p.match(/^\/quest\/([^/]+)$/);
    if (qm) return renderQuest(decodeURIComponent(qm[1]));
    go('/', { replace: true });
  }
  window.addEventListener('routechange', route);
  route();
  // Re-fetch when the tab comes back (he'll leave it open on the phone).
  document.addEventListener('visibilitychange', () => { if (!document.hidden) route(); });
})();
</script>
</body>
</html>
