      const out = { ...r, name: f.name.value.trim(), cost: { ...(coins ? { coins } : {}), ...(screenMinutes ? { screenMinutes } : {}) }, savingsGoal: f.savingsGoal.checked };
      const note = f.note.value.trim(); if (note) out.note = note; else delete out.note;
      return out;
    }
    L.on(m, 'click', '[data-new]', () => { editing = 'new'; paint(); window.scrollTo(0, 0); });
    L.on(m, 'click', '[data-edit]', (e, b) => { editing = editing === b.dataset.edit ? null : b.dataset.edit; paint(); });
    L.on(m, 'click', '[data-cancel]', () => { editing = null; paint(); });
    L.on(m, 'click', '[data-enable]', (e, b) => { const r = config.rewards.find(x => x.id === b.dataset.enable); r.enabled = r.enabled === false; save(r.name + (r.enabled ? ' enabled' : ' disabled')); });
    L.on(m, 'click', '[data-move]', (e, b) => { const [i, d] = b.dataset.move.split(':').map(Number); const j = i + d; if (j < 0 || j >= config.rewards.length) return; [config.rewards[i], config.rewards[j]] = [config.rewards[j], config.rewards[i]]; save('Reordered'); });
    L.on(m, 'click', '[data-del]', (e, b) => { if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Really delete?'; return; } config.rewards = config.rewards.filter(r => r.id !== b.dataset.del); save('Deleted'); });
    L.on(m, 'submit', '[data-rform]', (e, f) => {
      e.preventDefault();
      const id = f.dataset.rform; const name = f.name.value.trim(); if (!name) { toast('Name required', true); return; }
      const cost = (Number(f.coins.value) || 0) + (Number(f.screenMinutes.value) || 0); if (!cost) { toast('Set a cost in coins or screen minutes', true); return; }
      if (id === 'new') {
        let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'reward', slug = base, n = 2;
        while ((config.rewards || []).some(r => r.id === slug)) slug = base + '-' + n++;
        (config.rewards = config.rewards || []).push(read(f, { id: slug, enabled: true })); save('Added ' + name);
      } else { const i = config.rewards.findIndex(r => r.id === id); if (i < 0) return; config.rewards[i] = read(f, config.rewards[i]); save('Saved ' + name); }
    });
    paint();
  }

  // ── Settings ──────────────────────────────────────────────────────
  async function renderSettings() {
    shell('/hq/settings', '<p class="muted">Loading…</p>');
    config = await api('/config');
    const m = main();
    const cv = config.coinValue || { currency: 'TWD', perCoin: 0 };
    const pack = config.pack || { mode: 'paper' };
    m.innerHTML = '<div class="head"><div><h1>Settings</h1><div class="sub">The few numbers the whole system hangs on.</div></div></div>' +
      '<form id="settings" class="card" style="max-width:720px"><div class="qform" style="border:0;margin:0;padding:0">' +
        '<div class="f span3"><label>Child\'s name</label><input type="text" name="name" value="' + esc(config.child && config.child.name || 'Edward') + '"></div>' +
        '<div class="f span3"><label>Timezone</label><input type="text" value="' + esc(config.child && config.child.timezone || 'Asia/Taipei') + '" disabled></div>' +
        '<div class="f span2"><label>XP per level</label><input type="number" name="xpPerLevel" min="50" step="50" value="' + (config.levels && config.levels.xpPerLevel || 400) + '"></div>' +
        '<div class="f span2"><label>Coin currency</label><input type="text" name="currency" value="' + esc(cv.currency || 'TWD') + '"></div>' +
        '<div class="f span2"><label>Value per coin</label><input type="number" name="perCoin" min="0" step="0.01" value="' + (cv.perCoin || 0) + '"></div>' +
        '<div class="f span6"><label>Pack check mode</label><div class="seg"><button type="button" data-mode="paper" class="' + (pack.mode !== 'phone' ? 'on' : '') + '">Paper slip — ticked at school, entered at home</button><button type="button" data-mode="phone" class="' + (pack.mode === 'phone' ? 'on' : '') + '">Phone at the locker</button></div></div>' +
        '<div class="actions"><button class="btn primary" type="submit">Save settings</button></div></div></form>' +
      '<p class="muted small" style="max-width:720px;margin-top:12px">Set the coin value once and leave it. Changing it retroactively moves the savings goals under him. Balances are never stored — they are always the sum of the ledger, so nothing here rewrites history.</p>';
    L.on(m, 'click', '[data-mode]', (e, b) => { m.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
    m.querySelector('#settings').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target;
      config.child = { ...(config.child || {}), name: f.name.value.trim() || 'Edward' };
      config.levels = { ...(config.levels || { curve: 'linear' }), xpPerLevel: Math.max(50, Number(f.xpPerLevel.value) || 400) };
      config.coinValue = { currency: f.currency.value.trim() || 'TWD', perCoin: Math.max(0, Number(f.perCoin.value) || 0) };
      config.pack = { ...(config.pack || {}), mode: m.querySelector('[data-mode].on').dataset.mode };
      try { config = await api('/config', { method: 'PUT', body: config }); toast('Settings saved'); } catch (err) { toast(err.message, true); }
    });
  }

  // ── Router ────────────────────────────────────────────────────────
  L.on(document.body, 'click', '[data-logout]', async () => { await api('/hq/logout', { method: 'POST' }); gate('Signed out.'); });
  async function route() {
    const p = path();
    window.scrollTo(0, 0);
    try {
      const s = await api('/hq/session');
      if (!s.hq) return gate();
      await guard(async () => {
        if (p === '/hq') return renderLog();
        if (p === '/hq/list') return renderList();
        if (p === '/hq/history') return renderHistory();
        if (p === '/hq/quests') return renderQuests();
        if (p === '/hq/rewards') return renderRewards();
        if (p === '/hq/settings') return renderSettings();
        const slip = p.match(/^\/hq\/slip\/(\d{4}-\d{2}-\d{2})$/);
        if (slip) return renderSlip(slip[1]);
        go('/hq', { replace: true });
      });
    } catch (e) {
      root.innerHTML = '<div class="gate"><div class="card"><b>Could not load</b><div class="muted small" style="margin:6px 0 14px">' + esc(e.message) + '</div><button class="btn" onclick="location.reload()">Try again</button></div></div>';
    }
  }
  window.addEventListener('routechange', route);
  route();
})();
</script>
</body>
</html>
