<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loadout HQ</title>
<meta name="theme-color" content="#F5F4F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F5F4F0; --surface: #FFFFFF; --surface-alt: #FAF9F6; --border: #E2DFD8; --border-strong: #CFCBC2;
    --text: #1A1D24; --muted: #5C6270; --gold: #A9701A; --green: #2F7A5C; --red: #B4433A;
    --gold-bg: #FBF3E4; --green-bg: #E9F4EE; --red-bg: #F9E9E7;
    --display: 'Space Grotesk', system-ui, sans-serif; --body: 'IBM Plex Sans', system-ui, sans-serif;
    --r-ctl: 10px; --r-card: 12px; --r-hero: 16px; --r-pill: 999px;
    --side: 220px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .ic { display: inline-block; vertical-align: middle; flex: none; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -.01em; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 0; }
  h3 { font-family: var(--display); font-weight: 700; font-size: 14px; margin: 0; }
  .eyebrow { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }

  .shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .side .brand { font-family: var(--display); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; padding: 6px 10px 18px; }
  .side .brand span { color: var(--gold); }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: var(--r-ctl); font-weight: 500; color: var(--muted); min-height: 40px; }
  .nav a.active { background: var(--ground); color: var(--text); }
  .nav a:hover { color: var(--text); }
  .nav .soon { padding: 14px 10px 0; font-size: 12px; color: var(--muted); }
  .side .foot { margin-top: auto; }
  main { padding: 28px 36px 60px; max-width: 1180px; width: 100%; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .head .sub { color: var(--muted); margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 18px; }
  .card.hero { border-radius: var(--r-hero); }
  .card + .card { margin-top: 14px; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 14px; }
  .stat .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat .val { font-size: 22px; margin-top: 2px; line-height: 1.1; }
  .stat .val small { font-size: 12px; color: var(--muted); font-family: var(--body); font-weight: 500; margin-left: 2px; }
  .stat.warn .val { color: var(--red); }
  .stat.gold .val { color: var(--gold); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; border: 1px solid var(--border-strong); background: var(--surface); white-space: nowrap; }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary:hover { background: #2B2F38; }
  .btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
  .btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .btn.icon { padding: 0; width: 38px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.danger { color: var(--red); }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); overflow: hidden; }
  .seg > * { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; font-weight: 500; font-size: 14px; border-right: 1px solid var(--border-strong); }
  .seg > *:last-child { border-right: 0; }
  .seg > .on { background: var(--text); color: #fff; }
  .seg > *:hover:not(.on) { background: var(--surface-alt); }
  input[type=text], input[type=date], input[type=password], textarea { min-height: 38px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); outline: 0; width: 100%; }
  input:focus, textarea:focus { border-color: var(--text); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.wrap { flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface-alt); color: var(--muted); }
  .chip.ok { color: var(--green); background: var(--green-bg); border-color: transparent; }
  .chip.gold { color: var(--gold); background: var(--gold-bg); border-color: transparent; }
  .chip.bad { color: var(--red); background: var(--red-bg); border-color: transparent; }
  .chip.btn-chip { cursor: pointer; min-height: 30px; padding: 0 10px 0 8px; }
  .chip.btn-chip:hover { border-color: var(--border-strong); color: var(--text); }

  /* Item editor */
  .items .it { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .items .it .n { width: 22px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .items .it input { flex: 1; }
  .items .it .x { width: 34px; height: 38px; display: grid; place-items: center; color: var(--muted); border-radius: var(--r-ctl); }
  .items .it .x:hover { color: var(--red); background: var(--red-bg); }

  /* Verification table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.c, th.c { text-align: center; }
  .tick { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--border-strong); color: transparent; }
  .tick.on { background: var(--green); border-color: var(--green); color: #fff; }
  .tick.child { border-style: dashed; }
  .vseg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .vseg button { min-width: 64px; min-height: 30px; font-size: 12px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--border-strong); }
  .vseg button:last-child { border-right: 0; }
  .vseg button.on.a { background: var(--green); color: #fff; }
  .vseg button.on.m { background: var(--red); color: #fff; }
  .note-bad { color: var(--red); font-weight: 600; }

  /* Week strip */
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .wday { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 10px; background: var(--surface-alt); text-align: left; min-height: 96px; display: flex; flex-direction: column; gap: 6px; }
  .wday.today { border-color: var(--text); }
  .wday.cur { background: var(--gold-bg); }
  .wday .d { font-family: var(--display); font-weight: 700; font-size: 13px; }
  .wday .d span { color: var(--muted); font-weight: 500; font-family: var(--body); }
  .wday .dots { display: flex; gap: 4px; }
  .dot { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; font-family: var(--display); color: var(--muted); background: var(--surface); border: 1px solid var(--border); }
  .dot.on { color: #fff; background: var(--green); border-color: var(--green); }
  .dot.warn { color: #fff; background: var(--red); border-color: var(--red); }
  .wday .cnt { font-size: 12px; color: var(--muted); margin-top: auto; }

  .list li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .list li:last-child { border-bottom: 0; }
  .list { list-style: none; margin: 0; padding: 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px); background: var(--text); color: #fff; padding: 10px 16px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--red); }

  /* Switch */
  .switch { position: relative; width: 40px; height: 22px; border-radius: 999px; background: var(--border-strong); border: 0; flex: none; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(18px); }

  /* Check-ins / approvals */
  .ci { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .ci:last-child { border-bottom: 0; }
  .ci .cn { font-weight: 600; }
  .ci .cs { font-size: 13px; color: var(--muted); }
  .ci .ca { margin-left: auto; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ci .ca b { font-weight: 600; }
  .ci .cb { display: flex; gap: 6px; }
  .adjform { width: 100%; display: grid; grid-template-columns: 80px 80px 80px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0 4px; }
  .adjform label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .adjform input[type=number] { min-height: 34px; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 8px; width: 100%; }

  /* Quest editor */
  .qcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 16px; margin-top: 10px; }
  .qcard.off { opacity: .6; }
  .qhead { display: flex; align-items: center; gap: 14px; }
  .qhead .qn { font-weight: 600; font-size: 15px; }
  .qhead .qs { font-size: 13px; color: var(--muted); }
  .qhead .qr { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .qform { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 12px; }
  .qform .f { display: flex; flex-direction: column; gap: 4px; }
  .qform .f label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .qform .f input, .qform .f select { min-height: 36px; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
  .qform .span2 { grid-column: span 2; } .qform .span3 { grid-column: span 3; } .qform .span6 { grid-column: span 6; }
  .dayseg { display: flex; gap: 4px; }
  .dayseg button, .puchips button { min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); }
  .dayseg button.on, .puchips button.on { background: var(--text); color: #fff; border-color: var(--text); }
  .puchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .checkrow { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 13px; }
  .qform .actions { grid-column: span 6; display: flex; gap: 8px; align-items: center; padding-top: 4px; }
  .qform .actions .right { margin-left: auto; display: flex; gap: 8px; }

  /* History */
  .wgrid { width: 100%; border-collapse: separate; border-spacing: 4px; }
  .wgrid th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: center; padding: 2px 0 4px; border: 0; }
  .wgrid th.wk { text-align: left; }
  .wgrid td { padding: 0; border: 0; }
  .wgrid td.wk { font-size: 12px; color: var(--muted); white-space: nowrap; padding-right: 8px; font-variant-numeric: tabular-nums; }
  .cell { display: block; min-height: 56px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-alt); padding: 6px 8px; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .cell.none { background: transparent; border-style: dashed; }
  .cell.future { background: transparent; border-color: transparent; }
  .cell.ok { background: var(--green-bg); border-color: transparent; color: var(--green); }
  .cell.warn { background: var(--red-bg); border-color: transparent; color: var(--red); }
  .cell.open { background: var(--gold-bg); border-color: transparent; color: var(--gold); }
  .cell.today { outline: 2px solid var(--text); outline-offset: -2px; }
  .cell b { display: block; font-size: 13px; font-family: var(--display); }
  .cell:hover { filter: brightness(.97); }
  .rate { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .rate .rb { flex: 1; height: 8px; background: var(--ground); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .rate .rb i { display: block; height: 100%; background: var(--green); }
  .rate .rb i.bad { background: var(--red); }
  .rate .rb i.gold { background: var(--gold); }
  .rate span { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .matrix { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 6px; align-items: stretch; }
  .matrix .mh { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; }
  .matrix .mc { border-radius: 10px; padding: 14px; border: 1px solid var(--border); background: var(--surface-alt); }
  .matrix .mc .n { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; }
  .matrix .mc .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .matrix .mc.good { background: var(--green-bg); border-color: transparent; } .matrix .mc.good .n { color: var(--green); }
  .matrix .mc.pack { background: var(--red-bg); border-color: transparent; } .matrix .mc.pack .n { color: var(--red); }
  .matrix .mc.attn { background: var(--gold-bg); border-color: transparent; } .matrix .mc.attn .n { color: var(--gold); }
  .headline { padding: 12px 14px; border-radius: 10px; background: var(--surface-alt); border: 1px solid var(--border); font-size: 14px; margin-bottom: 14px; }
  .headline b { font-weight: 600; }
  .qbar { display: flex; gap: 3px; }
  .qbar i { display: block; width: 14px; height: 14px; border-radius: 3px; background: var(--ground); border: 1px solid var(--border); }
  .qbar i.p { background: var(--green); border-color: var(--green); }
  .qbar i.h { background: var(--gold); border-color: var(--gold); }
  .qbar i.z { background: var(--red-bg); border-color: var(--red-bg); }
  details.days summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 14px; padding: 4px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.days summary::-webkit-details-marker { display: none; }
  details.days[open] summary .ic { transform: rotate(90deg); }

  /* PIN gate */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .gate .card { width: 360px; max-width: 100%; padding: 28px; }
  .gate input { font-size: 24px; letter-spacing: .3em; text-align: center; font-family: var(--display); min-height: 52px; }

  /* Print slip */
  .slip { background: #fff; color: #000; border: 1px solid var(--border); border-radius: var(--r-card); padding: 28px 32px; max-width: 520px; font-family: var(--body); }
  .slip .t { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 14px; }
  .slip .t b { font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: 13px; }
  .slip .h { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin: 16px 0 6px; }
  .slip .li { display: flex; align-items: center; gap: 12px; min-height: 34px; font-size: 17px; }
  .slip .bx { width: 22px; height: 22px; border: 2px solid #000; border-radius: 5px; flex: none; }
  .slip .line { flex: 1; border-bottom: 1.5px solid #000; height: 24px; }
  .slip .f { margin-top: 18px; font-size: 12px; color: #333; border-top: 1px solid #999; padding-top: 8px; }
  @media print {
    body { background: #fff; }
    .shell { display: block; }
    .side, .no-print { display: none !important; }
    main { padding: 0; max-width: none; }
    .slip { border: 0; border-radius: 0; padding: 0; max-width: none; }
    @page { margin: 16mm; }
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 4px; padding: 10px 12px; overflow-x: auto; }
    .side .brand { padding: 0 8px 0 0; white-space: nowrap; }
    .nav { display: flex; gap: 2px; } .nav .soon { display: none; } .side .foot { margin: 0 0 0 auto; }
    main { padding: 18px 16px 40px; }
    .grid2 { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script src="/loadout/common.js"></script>
<script>
(function () {
  'use strict';
  const { api, esc, icon, path, go, href, linkify, todayKey, addDays, mondayOf, weekday, fmtDate, relDay, fmtTime, isSchoolDay, nextSchoolDay, DAY_LABEL, DAY_LONG } = L;
  const root = document.getElementById('root');
  linkify(document.body);
  let config = null;

  let toastTimer;
  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2400);
  }
  function q(name) { return new URLSearchParams(location.search).get(name); }
  function withDate(p, date) { return p + '?date=' + date; }
  function isKey(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
  const sign = n => (n < 0 ? '−' : '+') + Math.abs(n | 0);
  function awardText(a) {
    if (!a) return '—';
    const p = [];
    if (a.xp) p.push('<b>' + sign(a.xp) + '</b> XP');
    if (a.coins) p.push('<b style="color:var(--gold)">' + sign(a.coins) + '</b> coins');
    if (a.screenMinutes) p.push('<b>' + sign(a.screenMinutes) + '</b> min');
    return p.length ? p.join(' · ') : '—';
  }
  function valueText(q, c) {
    if (!q) return String(c.value);
    if (q.kind === 'simple') return 'done';
    if (q.kind === 'count') return c.value + ' ' + (q.unitLabel || '');
    return c.value + ' / ' + q.target + ' ' + (q.unitLabel || '') + (c.targetMet ? '' : ' (below target)');
  }
  function checkinRow(c, q, date, cfg, { showDate = false, pending = false } = {}) {
    const pus = (c.powerUps || []).map(id => { const p = (cfg.powerUps || []).find(x => x.id === id); return p ? p.label : id; });
    const chip = c.status === 'pending' ? '<span class="chip gold">pending</span>' : c.status === 'adjusted' ? '<span class="chip">adjusted</span>' : '<span class="chip ok">paid</span>';
    return '<div class="ci" data-ci="' + esc(c.id) + '"><div><div class="cn">' + esc(q ? q.name : c.questId) + (showDate ? ' <span class="muted small">' + fmtDate(date) + '</span>' : '') + '</div>' +
      '<div class="cs">' + esc(valueText(q, c)) + (c.focusMinutes ? ' · ' + c.focusMinutes + ' min focus' : '') + (pus.length ? ' · ' + esc(pus.join(', ')) : '') + (c.note ? ' · <i>' + esc(c.note) + '</i>' : '') + '</div></div>' +
      '<div class="ca">' + awardText(c.awarded) + '<div>' + chip + '</div></div>' +
      '<div class="cb">' + (pending ? '<button class="btn sm primary" type="button" data-confirm="' + esc(c.id) + '">Confirm</button>' : '') + '<button class="btn sm" type="button" data-adjust="' + esc(c.id) + '">Adjust</button></div></div>';
  }
  function adjustForm(c) {
    const a = c.awarded || { xp: 0, coins: 0, screenMinutes: 0 };
    return '<form class="adjform" data-adjform="' + esc(c.id) + '"><div><label>XP</label><input type="number" name="xp" value="' + a.xp + '"></div><div><label>Coins</label><input type="number" name="coins" value="' + a.coins + '"></div><div><label>Screen min</label><input type="number" name="screenMinutes" value="' + a.screenMinutes + '"></div>' +
      '<div><label>Note (required)</label><input type="text" name="note" placeholder="Why?" maxlength="300" required></div><button class="btn sm primary" type="submit">Save</button><button class="btn sm" type="button" data-cancel-adjust>Cancel</button></form>';
  }
  function costText(c) { const p = []; if (c && c.coins) p.push('<b style="color:var(--gold)">' + c.coins.toLocaleString() + '</b> coins'); if (c && c.screenMinutes) p.push('<b>' + c.screenMinutes + '</b> min'); return p.join(' · ') || '—'; }
  function requestRow(r, bal) {
    const isSug = r.kind === 'suggest';
    const short = bal && !isSug && ((r.cost.coins || 0) > bal.coins || (r.cost.screenMinutes || 0) > bal.screenMinutes);
    return '<div class="ci" data-req="' + esc(r.id) + '"><div><div class="cn">' + esc(r.name) + ' <span class="chip' + (isSug ? '' : ' gold') + '">' + (isSug ? 'suggestion' : 'redeem') + '</span></div>' +
      '<div class="cs">' + (isSug ? (r.cost.coins ? 'Edward suggests ' + r.cost.coins + ' coins' : 'no price suggested') + (r.note ? ' · <i>' + esc(r.note) + '</i>' : '') : costText(r.cost) + (short ? ' · <span class="note-bad">balance is short</span>' : '')) + ' · ' + relDay(r.requestedAt.slice(0, 10)) + ' ' + fmtTime(r.requestedAt) + '</div></div>' +
      '<div class="cb">' + (isSug
        ? '<form class="adjform" data-sugform="' + esc(r.id) + '" style="padding:0;grid-template-columns:80px 80px auto auto auto"><div><label>Coins</label><input type="number" name="coins" value="' + (r.cost.coins || 0) + '" min="0"></div><div><label>Screen min</label><input type="number" name="screenMinutes" value="0" min="0"></div><label class="checkrow" style="font-size:12px"><input type="checkbox" name="savingsGoal"> savings goal</label><button class="btn sm primary" type="submit">Add reward</button><button class="btn sm" type="button" data-deny="' + esc(r.id) + '">Deny</button></form>'
        : '<button class="btn sm primary" type="button" data-approve="' + esc(r.id) + '"' + (short ? ' disabled' : '') + '>Approve</button><button class="btn sm" type="button" data-deny="' + esc(r.id) + '">Deny</button>') + '</div></div>';
  }
  function bindRequestActions(m, reload) {
    L.on(m, 'click', '[data-approve]', async (e, b) => {
      b.disabled = true;
      try { await api('/requests/' + b.dataset.approve + '/approve', { method: 'POST', body: {} }); toast('Approved — coins spent'); reload(); }
      catch (err) { b.disabled = false; toast(err.message, true); }
    });
    L.on(m, 'click', '[data-deny]', async (e, b) => {
      const row = b.closest('[data-req]');
      if (!row.querySelector('[data-denynote]')) {
        row.insertAdjacentHTML('beforeend', '<form class="adjform" data-denynote="' + esc(b.dataset.deny) + '" style="grid-template-columns:1fr auto auto"><div><label>Reason (Edward sees this)</label><input type="text" name="note" maxlength="300" placeholder="Optional"></div><button class="btn sm danger" type="submit">Deny</button><button class="btn sm" type="button" data-cancel-adjust>Cancel</button></form>');
        row.querySelector('[data-denynote] input').focus();
      }
    });
    L.on(m, 'submit', '[data-denynote]', async (e, f) => {
      e.preventDefault();
      try { await api('/requests/' + f.dataset.denynote + '/deny', { method: 'POST', body: { note: f.note.value } }); toast('Denied'); reload(); }
      catch (err) { toast(err.message, true); }
    });
    L.on(m, 'submit', '[data-sugform]', async (e, f) => {
      e.preventDefault();
      try { await api('/requests/' + f.dataset.sugform + '/approve', { method: 'POST', body: { coins: Number(f.coins.value), screenMinutes: Number(f.screenMinutes.value), savingsGoal: f.savingsGoal.checked } }); toast('Added to rewards'); reload(); }
      catch (err) { toast(err.message, true); }
    });
  }
  function bindCheckinActions(m, reload) {
    L.on(m, 'click', '[data-confirm]', async (e, b) => {
      b.disabled = true;
      try { await api('/checkin/' + b.dataset.confirm + '/confirm', { method: 'POST' }); toast('Confirmed and paid'); reload(); }
      catch (err) { b.disabled = false; toast(err.message, true); }
    });
    L.on(m, 'click', '[data-adjust]', (e, b) => {
      const row = b.closest('[data-ci]'); if (row.querySelector('.adjform')) return;
      const id = row.dataset.ci; const c = m.__checkins[id]; if (!c) return;
      row.insertAdjacentHTML('beforeend', adjustForm(c)); row.querySelector('input[name=note]').focus();
    });
    L.on(m, 'click', '[data-cancel-adjust]', (e, b) => b.closest('.adjform').remove());
    L.on(m, 'submit', '[data-adjform]', async (e, f) => {
      e.preventDefault();
      const awarded = { xp: Number(f.xp.value), coins: Number(f.coins.value), screenMinutes: Number(f.screenMinutes.value) };
      try { await api('/checkin/' + f.dataset.adjform + '/adjust', { method: 'POST', body: { awarded, note: f.note.value } }); toast('Adjusted'); reload(); }
      catch (err) { toast(err.message, true); }
    });
  }

  // ── Shell ─────────────────────────────────────────────────────────
  function shell(active, body) {
    const nav = [['/hq', 'calendar', 'Daily log'], ['/hq/list', 'list', 'Pack list'], ['/hq/quests', 'sword', 'Quests'], ['/hq/rewards', 'vault', 'Rewards'], ['/hq/history', 'history', 'History'], ['/hq/settings', 'settings', 'Settings']];
    root.innerHTML = '<div class="shell"><aside class="side"><div class="brand">Loadout <span>HQ</span></div><nav class="nav">' +
      nav.map(([p, ic, l]) => '<a href="' + href(p) + '" data-link class="' + (active === p ? 'active' : '') + '">' + icon(ic, 18) + l + '</a>').join('') +
      '</nav>' +
      '<div class="foot"><a href="' + href('/') + '" class="btn sm" style="width:100%;justify-content:flex-start">' + icon('eye', 16) + ' Edward\'s view</a>' +
      '<button class="btn sm" data-logout style="width:100%;justify-content:flex-start;margin-top:6px">' + icon('logout', 16) + ' Sign out</button></div></aside>' +
      '<main id="main">' + body + '</main></div>';
  }
  const main = () => document.getElementById('main');

  // ── PIN gate ──────────────────────────────────────────────────────
  function gate(msg) {
    root.innerHTML = '<div class="gate"><form class="card" id="pinform"><div class="eyebrow" style="margin-bottom:6px">Loadout HQ</div><h1 style="margin-bottom:16px">Parent PIN</h1>' +
      '<input type="password" inputmode="numeric" autocomplete="current-password" id="pin" placeholder="••••" autofocus>' +
      '<div class="small" id="pinmsg" style="min-height:20px;margin:8px 0;color:var(--red)">' + esc(msg || '') + '</div>' +
      '<button class="btn primary" style="width:100%;min-height:44px" type="submit">Unlock</button></form></div>';
    document.getElementById('pinform').addEventListener('submit', async e => {
      e.preventDefault();
      try { await api('/hq/login', { method: 'POST', body: { pin: document.getElementById('pin').value } }); route(); }
      catch (err) { document.getElementById('pinmsg').textContent = err.message; document.getElementById('pin').select(); }
    });
  }
  async function guard(fn) {
    try { return await fn(); }
    catch (e) { if (e.status === 401) { gate(); return; } throw e; }
  }

  // ── Stat tiles from history (this week) ───────────────────────────
  function weekStats(hist, monday) {
    const days = hist.days.filter(d => d.date >= monday && d.date <= addDays(monday, 6) && d.written);
    const sum = k => days.reduce((a, d) => a + d.counts[k], 0);
    const schoolDaysSoFar = [0, 1, 2, 3, 4].map(i => addDays(monday, i)).filter(k => k <= todayKey()).length;
    return { listed: days.length, schoolDaysSoFar, submitted: days.filter(d => d.submitted).length, verified: days.filter(d => d.verified).length,
      ticked: sum('ticked'), arrived: sum('arrived'), tickedMissing: sum('tickedMissing'), notTicked: sum('notTicked'), items: sum('items') };
  }

  // ── Daily log ─────────────────────────────────────────────────────
  async function renderLog() {
    const date = isKey(q('date')) ? q('date') : todayKey();
    shell('/hq', '<p class="muted">Loading…</p>');
    const weeksBack = Math.min(52, Math.max(2, Math.round((new Date(mondayOf(todayKey())) - new Date(mondayOf(date))) / 6048e5) + 2));
    const [ov, hist] = await Promise.all([api('/hq/overview?date=' + date), api('/history/pack?weeks=' + weeksBack)]);
    config = ov.config;
    const monday = mondayOf(date);
    const ws = weekStats(hist, monday);
    const pc = ov.day.packCheck;

    // Pack card for the day
    let pack;
    if (!pc || !pc.items.length) {
      pack = '<div class="card hero"><div class="row spread"><div><div class="eyebrow">Pack check · ' + relDay(date) + '</div><h2 style="margin-top:4px">No list for this day</h2>' +
        '<p class="muted small" style="margin:6px 0 0">' + (isSchoolDay(date) ? 'Nothing downstream works without the list.' : 'Weekend — no pack check unless you write one.') + '</p></div>' +
        '<a class="btn primary" href="' + href(withDate('/hq/list', date)) + '" data-link>' + icon('list', 16) + ' Write the list</a></div></div>';
    } else {
      const v = pc.verification;
      const st = v ? new Map([...v.arrived.map(id => [id, 'a']), ...v.missing.map(id => [id, 'm'])]) : new Map();
      const rows = pc.items.map(i => '<tr data-item="' + esc(i.id) + '"><td>' + esc(i.label) + (i.source === 'child' ? ' <span class="chip">added by Edward</span>' : '') + '</td>' +
        '<td class="c"><span class="tick' + (i.checked ? ' on' : '') + (i.source === 'child' ? ' child' : '') + '">' + icon('check', 14) + '</span></td>' +
        '<td class="c"><span class="vseg"><button type="button" class="a' + (st.get(i.id) === 'a' ? ' on' : '') + '" data-v="a">Arrived</button><button type="button" class="m' + (st.get(i.id) === 'm' ? ' on' : '') + '" data-v="m">Missing</button></span></td></tr>').join('');
      const status = pc.submittedAt
        ? '<span class="chip ok">' + icon('check', 12) + ' Submitted ' + fmtTime(pc.submittedAt) + '</span>'
        : '<span class="chip">Not submitted yet</span>';
      const verifiedChip = v ? '<span class="chip gold">Verified ' + fmtTime(v.verifiedAt) + '</span>' : '';
      pack = '<div class="card hero"><div class="row spread" style="margin-bottom:12px"><div><div class="eyebrow">Pack check · ' + relDay(date) + '</div><h2 style="margin-top:4px">' + pc.items.filter(i => i.checked).length + ' of ' + pc.items.length + ' ticked</h2></div>' +
        '<div class="row wrap">' + status + verifiedChip + '</div></div>' +
        '<table><thead><tr><th>Item</th><th class="c" style="width:70px">Ticked</th><th class="c" style="width:150px">In the bag?</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div class="row" style="margin-top:14px;gap:8px"><button class="btn sm" type="button" data-all-arrived>All arrived</button><button class="btn sm" type="button" data-ticked-arrived>Ticked = arrived</button></div>' +
        '<div style="margin-top:12px"><input type="text" id="vnote" placeholder="Note (e.g. reading log ticked but not in bag)" value="' + esc(v ? v.note : '') + '" maxlength="500"></div>' +
        '<div class="row spread" style="margin-top:12px"><div class="row" style="gap:8px"><button class="btn primary" type="button" data-verify>' + icon('check', 16) + ' Save verification</button>' +
        '<a class="btn" href="' + href(withDate('/hq/list', date)) + '" data-link>Edit list</a></div>' +
        (pc.submittedAt ? '<button class="btn sm danger" type="button" data-reopen>Reopen for Edward</button>' : '') + '</div>' +
        (pc.awarded ? '<p class="muted small" style="margin:12px 0 0">Awarded on submit: +' + pc.awarded.xp + ' XP, +' + pc.awarded.coins + ' coins. Verification is for the record and never changes the award.</p>' : '') +
        '</div>';
    }

    // Week strip
    const byDate = new Map(hist.days.map(d => [d.date, d]));
    const stripDays = [0, 1, 2, 3, 4, 5, 6].filter(i => i < 5 || (byDate.get(addDays(monday, i)) || {}).written || addDays(monday, i) === date);
    const strip = stripDays.map(i => {
      const k = addDays(monday, i); const d = byDate.get(k);
      const dots = '<span class="dot' + (d && d.written ? ' on' : '') + '" title="List written">L</span>' +
        '<span class="dot' + (d && d.submitted ? ' on' : '') + '" title="Submitted">S</span>' +
        '<span class="dot' + (d && d.verified ? (d.counts.tickedMissing || d.counts.notTickedMissing ? ' warn' : ' on') : '') + '" title="Verified">V</span>';
      const cnt = d && d.written ? d.counts.ticked + '/' + d.counts.items + ' ticked' + (d.verified ? ' · ' + d.counts.arrived + ' arrived' : '') : (k > todayKey() ? 'upcoming' : 'no list');
      return '<a class="wday' + (k === todayKey() ? ' today' : '') + (k === date ? ' cur' : '') + '" href="' + href(withDate('/hq', k)) + '" data-link>' +
        '<div class="d">' + DAY_LABEL[weekday(k)] + ' <span>' + k.slice(8) + '</span></div><div class="dots">' + dots + '</div><div class="cnt">' + cnt + '</div></a>';
    }).join('');

    const missed = hist.days.filter(d => d.date >= monday && d.date <= addDays(monday, 6) && d.tickedMissing.length)
      .flatMap(d => d.tickedMissing.map(l => '<li><span>' + esc(l) + '</span><span class="muted small">' + fmtDate(d.date) + '</span></li>')).join('');
    const notTicked = hist.days.filter(d => d.date >= monday && d.date <= addDays(monday, 6) && d.submitted && d.notTicked.length)
      .flatMap(d => d.notTicked.map(l => '<li><span>' + esc(l) + '</span><span class="muted small">' + fmtDate(d.date) + '</span></li>')).join('');

    const pending = (ov.pendingCheckins.length + ov.openRequests.length) === 0
      ? '<div class="empty">Nothing waiting on you.</div>'
      : ov.pendingCheckins.map(p => checkinRow(p.checkin, p.quest, p.date, config, { showDate: true, pending: true })).join('') +
        ov.openRequests.map(r => requestRow(r, ov.balances)).join('');
    const board = (ov.questsOnBoard || []).filter(q => q.kind !== 'packCheck');
    const logged = ov.day.checkins || [];
    const notLogged = board.filter(q => !logged.some(c => c.questId === q.id) && (q.cadence || 'daily') === 'daily' && q.requiredForStreak !== false);
    const checkins = (logged.length ? logged.map(c => checkinRow(c, config.quests.find(q => q.id === c.questId), date, config, { pending: c.status === 'pending' })).join('') : '<div class="empty">Nothing logged ' + (date === todayKey() ? 'yet today' : 'that day') + '.</div>') +
      (notLogged.length ? '<div class="muted small" style="margin-top:10px">Not logged: ' + esc(notLogged.map(q => q.name).join(', ')) + '</div>' : '');

    main().innerHTML =
      '<div class="head"><div><h1>Daily log</h1><div class="sub">' + fmtDate(date, { long: true }) + (date === todayKey() ? ' · today' : '') + '</div></div>' +
      '<div class="row"><a class="btn icon" href="' + href(withDate('/hq', addDays(date, -1))) + '" data-link aria-label="Previous day">' + icon('left', 18) + '</a>' +
      '<a class="btn" href="' + href('/hq') + '" data-link>Today</a>' +
      '<a class="btn icon" href="' + href(withDate('/hq', addDays(date, 1))) + '" data-link aria-label="Next day">' + icon('right', 18) + '</a>' +
      '<input type="date" value="' + date + '" id="datepick" style="width:auto"></div></div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="lbl">Lists written</div><div class="val num">' + ws.listed + '<small>/ ' + ws.schoolDaysSoFar + ' days</small></div></div>' +
        '<div class="stat"><div class="lbl">Submitted</div><div class="val num">' + ws.submitted + '</div></div>' +
        '<div class="stat"><div class="lbl">Verified</div><div class="val num">' + ws.verified + '</div></div>' +
        '<div class="stat' + (ws.tickedMissing ? ' warn' : '') + '"><div class="lbl">Ticked, not in bag</div><div class="val num">' + ws.tickedMissing + '</div></div>' +
        '<div class="stat gold"><div class="lbl">Coins</div><div class="val num">' + ov.balances.coins.toLocaleString() + '</div></div>' +
        '<div class="stat"><div class="lbl">XP · level ' + ov.level.level + '</div><div class="val num">' + ov.balances.xp.toLocaleString() + '</div></div>' +
      '</div>' +
      '<div class="grid2"><div>' + pack +
        '<div class="card" style="margin-top:14px"><div class="row spread" style="margin-bottom:6px"><h3>Quests · ' + relDay(date) + '</h3><span class="muted small">' + logged.filter(c => c.targetMet).length + ' of ' + board.length + ' done</span></div>' + checkins + '</div></div><div>' +
        '<div class="card" style="border-color:' + (ov.pendingCheckins.length ? 'var(--gold)' : 'var(--border)') + '"><h3 style="margin-bottom:6px">Pending approvals' + (ov.pendingCheckins.length ? ' <span class="chip gold">' + ov.pendingCheckins.length + '</span>' : '') + '</h3>' + pending + '</div>' +
        '<div class="card"><div class="row spread" style="margin-bottom:10px"><h3>This week</h3><span class="muted small">' + fmtDate(monday) + ' – ' + fmtDate(addDays(monday, stripDays[stripDays.length - 1])) + '</span></div><div class="week" style="grid-template-columns:repeat(' + stripDays.length + ',1fr)">' + strip + '</div>' +
        '<div class="muted small" style="margin-top:8px">L list written · S submitted by Edward · V verified (red = something missing)</div></div>' +
        '<div class="card"><h3 style="margin-bottom:6px">Ticked but didn\'t arrive</h3><div class="muted small" style="margin-bottom:6px">Packing problem — it was on the list and he ticked it.</div>' + (missed ? '<ul class="list">' + missed + '</ul>' : '<div class="empty">None this week.</div>') + '</div>' +
        '<div class="card"><h3 style="margin-bottom:6px">Not ticked</h3><div class="muted small" style="margin-bottom:6px">Attention problem — on the list, never ticked.</div>' + (notTicked ? '<ul class="list">' + notTicked + '</ul>' : '<div class="empty">None this week.</div>') + '</div>' +
      '</div></div>';

    const m = main();
    m.__checkins = {};
    for (const c of logged) m.__checkins[c.id] = c;
    for (const p of ov.pendingCheckins) m.__checkins[p.checkin.id] = p.checkin;
    bindCheckinActions(m, renderLog);
    bindRequestActions(m, renderLog);
    m.querySelector('#datepick').addEventListener('change', e => { if (isKey(e.target.value)) go(withDate('/hq', e.target.value)); });
    L.on(m, 'click', '[data-v]', (e, b) => {
      const seg = b.parentElement; const on = b.classList.contains('on');
      seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      if (!on) b.classList.add('on');
    });
    L.on(m, 'click', '[data-all-arrived]', () => m.querySelectorAll('tr[data-item]').forEach(tr => { tr.querySelectorAll('[data-v]').forEach(x => x.classList.remove('on')); tr.querySelector('[data-v=a]').classList.add('on'); }));
    L.on(m, 'click', '[data-ticked-arrived]', () => m.querySelectorAll('tr[data-item]').forEach(tr => {
      const ticked = tr.querySelector('.tick').classList.contains('on');
      tr.querySelectorAll('[data-v]').forEach(x => x.classList.remove('on'));
      tr.querySelector(ticked ? '[data-v=a]' : '[data-v=m]').classList.add('on');
    }));
    L.on(m, 'click', '[data-verify]', async () => {
      const arrived = [], missing = [];
      m.querySelectorAll('tr[data-item]').forEach(tr => {
        if (tr.querySelector('[data-v=a].on')) arrived.push(tr.dataset.item);
        else if (tr.querySelector('[data-v=m].on')) missing.push(tr.dataset.item);
      });
      try { await api('/day/' + date + '/pack/verify', { method: 'POST', body: { arrived, missing, note: m.querySelector('#vnote').value } }); toast('Verification saved'); renderLog(); }
      catch (e) { toast(e.message, true); }
    });
    L.on(m, 'click', '[data-reopen]', async () => {
      try { await api('/day/' + date + '/pack/reopen', { method: 'POST' }); toast('Reopened — Edward can edit again'); renderLog(); }
      catch (e) { toast(e.message, true); }
    });
  }

  // ── Pack list writer ──────────────────────────────────────────────
  async function renderList() {
    const t = todayKey();
    const taipeiHour = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Taipei', hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
    const defaultDate = isSchoolDay(t) && taipeiHour < 12 ? t : nextSchoolDay(t);
    const date = isKey(q('date')) ? q('date') : defaultDate;
    shell('/hq/list', '<p class="muted">Loading…</p>');
    const [cfg, day, last] = await Promise.all([api('/config'), api('/day/' + date), api('/hq/last-list?before=' + date)]);
    config = cfg;
    const pc = day.packCheck;
    const locked = !!(pc && pc.submittedAt);
    let items = pc ? pc.items.filter(i => i.source === 'parent').map(i => ({ id: i.id, label: i.label })) : [];
    const childItems = pc ? pc.items.filter(i => i.source === 'child') : [];
    const recurring = (config.pack && config.pack.recurringItems) || [];

    function paintItems() {
      const box = main().querySelector('#items');
      box.innerHTML = items.map((it, i) => '<div class="it"><span class="n">' + (i + 1) + '</span><input type="text" value="' + esc(it.label) + '" data-i="' + i + '" placeholder="Item" maxlength="120"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '' : '<button class="x" type="button" data-rm="' + i + '" aria-label="Remove">' + icon('x', 16) + '</button>') + '</div>').join('') +
        (items.length ? '' : '<div class="empty">Empty list. Add items, pick recurring ones, or copy the last list.</div>');
      main().querySelector('#count').textContent = items.length + ' item' + (items.length === 1 ? '' : 's');
    }
    function syncFromInputs() {
      main().querySelectorAll('#items input[data-i]').forEach(inp => { items[Number(inp.dataset.i)].label = inp.value; });
    }
    function addItem(label = '') { syncFromInputs(); items.push({ label }); paintItems(); const inps = main().querySelectorAll('#items input'); if (inps.length) inps[inps.length - 1].focus(); }

    function recurringHtml() {
      return recurring.length ? recurring.map((r, i) => '<span class="chip btn-chip" data-rec="' + i + '">' + icon('plus', 12) + esc(r.label) + '<button type="button" data-rec-rm="' + i + '" aria-label="Remove recurring" style="margin-left:2px;color:inherit;opacity:.6">' + icon('x', 12) + '</button></span>').join('') : '<span class="empty">None yet.</span>';
    }
    const dateSeg = [['Today', t], ['Tomorrow', addDays(t, 1)], ['Next school day', nextSchoolDay(t)]]
      .map(([l, k]) => '<a href="' + href(withDate('/hq/list', k)) + '" data-link class="' + (k === date ? 'on' : '') + '">' + l + '</a>').join('');

    main().innerHTML =
      '<div class="head"><div><h1>Write the pack list</h1><div class="sub">' + fmtDate(date, { long: true }) + (['Today', 'Tomorrow', 'Yesterday'].includes(relDay(date)) ? ' · ' + relDay(date).toLowerCase() : '') + (isSchoolDay(date) ? '' : ' · <span class="note-bad">weekend</span>') + '</div></div>' +
      '<div class="row"><span class="seg">' + dateSeg + '</span><input type="date" value="' + date + '" id="datepick" style="width:auto"></div></div>' +
      (locked ? '<div class="card" style="border-color:var(--gold);background:var(--gold-bg);margin-bottom:14px"><div class="row">' + icon('lock', 18) + '<div><b>Edward has already submitted this day.</b> <span class="muted">The list is locked. Reopen it from the <a href="' + href(withDate('/hq', date)) + '" data-link style="text-decoration:underline">daily log</a> if you need to change it.</span></div></div></div>' : '') +
      '<div class="grid2"><div class="card hero"><div class="row spread"><h2>Bring home</h2><span class="muted small" id="count"></span></div>' +
        '<div class="items" id="items"></div>' +
        (locked ? '' : '<div class="row" style="margin-top:12px;gap:8px"><button class="btn sm" type="button" data-add>' + icon('plus', 14) + ' Add item</button>' +
          (last ? '<button class="btn sm" type="button" data-copy>' + icon('copy', 14) + ' Copy last list (' + fmtDate(last.date) + ', ' + last.items.length + ')</button>' : '') +
          (items.length ? '<button class="btn sm danger" type="button" data-clear>Clear</button>' : '') + '</div>') +
        (childItems.length ? '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:6px">Added by Edward</div><ul class="list">' + childItems.map(i => '<li><span>' + esc(i.label) + '</span><span class="chip' + (i.checked ? ' ok' : '') + '">' + (i.checked ? 'ticked' : 'not ticked') + '</span></li>').join('') + '</ul></div>' : '') +
        '<div class="row spread" style="margin-top:18px"><div class="row" style="gap:8px">' +
          (locked ? '' : '<button class="btn primary" type="button" data-save>' + icon('check', 16) + ' Save list</button>') +
          '<a class="btn" href="' + href('/hq/slip/' + date) + '" data-link' + (items.length ? '' : ' style="opacity:.5;pointer-events:none"') + '>' + icon('print', 16) + ' Print slip</a></div>' +
          '<span class="muted small" id="savestate">' + (pc && pc.writtenAt ? 'Saved ' + fmtTime(pc.writtenAt) + (pc.items.some(i => i.checked) ? ' · Edward has ticked ' + pc.items.filter(i => i.checked).length : '') : 'Not saved yet') + '</span></div>' +
      '</div>' +
      '<div><div class="card"><h3 style="margin-bottom:4px">Recurring items</h3><div class="muted small" style="margin-bottom:10px">Click to add to the list. Saved across days.</div>' +
        '<div class="row wrap" id="recur" style="gap:6px">' + recurringHtml() + '</div>' +
        '<form class="row" id="recform" style="margin-top:12px"><input type="text" placeholder="New recurring item" maxlength="120" id="recinput"><button class="btn sm" type="submit">Add</button></form></div>' +
        '<div class="card"><h3 style="margin-bottom:6px">How the loop works</h3><ol class="muted small" style="margin:0;padding-left:18px;line-height:1.7"><li>Write the list here, print the slip.</li><li>Edward ticks the slip at his locker after last period.</li><li>At home he enters the ticks in Loadout and submits — that pays the award.</li><li>You check the bag in the daily log: what actually arrived.</li></ol></div>' +
      '</div></div>';

    paintItems();
    const m = main();
    m.querySelector('#datepick').addEventListener('change', e => { if (isKey(e.target.value)) go(withDate('/hq/list', e.target.value)); });
    L.on(m, 'click', '[data-add]', () => addItem());
    L.on(m, 'click', '[data-rm]', (e, b) => { syncFromInputs(); items.splice(Number(b.dataset.rm), 1); paintItems(); });
    L.on(m, 'click', '[data-clear]', () => { items = []; paintItems(); });
    L.on(m, 'click', '[data-copy]', () => { syncFromInputs(); items = items.filter(i => i.label.trim()); const have = new Set(items.map(i => i.label.trim().toLowerCase())); last.items.forEach(i => { if (!have.has(i.label.toLowerCase())) items.push({ label: i.label }); }); paintItems(); });
    L.on(m, 'keydown', '#items input', (e, inp) => {
      if (e.key === 'Enter') { e.preventDefault(); if (Number(inp.dataset.i) === items.length - 1) addItem(); else m.querySelector('#items input[data-i="' + (Number(inp.dataset.i) + 1) + '"]').focus(); }
      if (e.key === 'Backspace' && inp.value === '' && items.length > 1) { e.preventDefault(); syncFromInputs(); items.splice(Number(inp.dataset.i), 1); paintItems(); const prev = m.querySelector('#items input[data-i="' + Math.max(0, Number(inp.dataset.i) - 1) + '"]'); if (prev) prev.focus(); }
    });
    L.on(m, 'click', '[data-rec]', (e, chip) => { if (e.target.closest('[data-rec-rm]') || locked) return; syncFromInputs(); const r = recurring[Number(chip.dataset.rec)]; if (!items.some(i => i.label.trim().toLowerCase() === r.label.toLowerCase())) { items = items.filter(i => i.label.trim()); items.push({ label: r.label }); paintItems(); } });
    L.on(m, 'click', '[data-rec-rm]', async (e, b) => { e.stopPropagation(); recurring.splice(Number(b.dataset.recRm), 1); await saveRecurring(); });
    m.querySelector('#recform').addEventListener('submit', async e => {
      e.preventDefault(); const v = m.querySelector('#recinput').value.trim(); if (!v) return;
      recurring.push({ id: 'rec_' + Date.now().toString(36), label: v }); await saveRecurring();
    });
    async function saveRecurring() {
      config.pack = config.pack || { mode: 'paper' }; config.pack.recurringItems = recurring;
      try { await api('/config', { method: 'PUT', body: config }); toast('Recurring items saved'); m.querySelector('#recur').innerHTML = recurringHtml(); m.querySelector('#recinput').value = ''; }
      catch (e) { toast(e.message, true); }
    }
    L.on(m, 'click', '[data-save]', async (e, b) => {
      syncFromInputs(); const clean = items.filter(i => i.label.trim());
      if (!clean.length) { toast('Add at least one item', true); return; }
      b.disabled = true;
      try { await api('/day/' + date + '/pack/items', { method: 'POST', body: { items: clean } }); toast('List saved for ' + relDay(date)); renderList(); }
      catch (err) { b.disabled = false; toast(err.message, true); }
    });
  }

  // ── Print slip ────────────────────────────────────────────────────
  async function renderSlip(date) {
    shell('/hq/list', '<p class="muted">Loading…</p>');
    const day = await api('/day/' + date);
    const items = day.packCheck ? day.packCheck.items.filter(i => i.source === 'parent') : [];
    main().innerHTML =
      '<div class="head no-print"><div><h1>Print slip</h1><div class="sub">' + fmtDate(date, { long: true }) + '</div></div><div class="row"><a class="btn" href="' + href(withDate('/hq/list', date)) + '" data-link>' + icon('left', 16) + ' Back to list</a><button class="btn primary" type="button" onclick="window.print()">' + icon('print', 16) + ' Print</button></div></div>' +
      '<div class="slip"><div class="t"><b>Loadout · Pack check</b><span>' + fmtDate(date, { long: true }) + '</span></div>' +
      '<div class="h">Bring home</div>' + (items.length ? items.map(i => '<div class="li"><span class="bx"></span><span>' + esc(i.label) + '</span></div>').join('') : '<div class="li muted">No items on the list.</div>') +
      '<div class="h">Came up today</div>' + '<div class="li"><span class="bx"></span><span class="line"></span></div>'.repeat(3) +
      '<div class="f">Tick each thing as it goes in the bag — at your locker, after last period. At home, enter the ticks in Loadout and hit <b>Packed</b>.</div></div>';
  }

  // ── History (phase 4) ─────────────────────────────────────────────
  const WD5 = ['mon', 'tue', 'wed', 'thu', 'fri'];
  function pct(a, b) { return b ? Math.round(100 * a / b) : null; }
  function rateHtml(a, b, cls) { const p = pct(a, b); return '<div class="rate"><div class="rb"><i class="' + (cls || '') + '" style="width:' + (p || 0) + '%"></i></div><span>' + (p === null ? '—' : p + '%') + '</span></div>'; }

  async function renderHistory() {
    const weeks = Math.min(52, Math.max(1, Number(q('weeks')) || 4));
    shell('/hq/history', '<p class="muted">Loading…</p>');
    const [hist, qh] = await Promise.all([api('/history/pack?weeks=' + weeks), api('/history/quests?weeks=' + weeks)]);
    const today = todayKey();
    const byDate = new Map(hist.days.map(d => [d.date, d]));
    const written = hist.days.filter(d => d.written);
    const verified = written.filter(d => d.verified);

    // ── summary + 2×2 over verified items ──
    const items = verified.flatMap(d => d.items.filter(i => i.arrived !== null));
    const m = { ta: 0, tm: 0, na: 0, nm: 0 };
    for (const i of items) m[(i.checked ? 't' : 'n') + (i.arrived ? 'a' : 'm')]++;
    const rangeEnd = today < hist.to ? today : hist.to;
    const schoolDaysSoFar = (() => { let n = 0; for (let k = hist.from; k <= rangeEnd; k = addDays(k, 1)) if (isSchoolDay(k)) n++; return n; })();
    const sum = (arr, k) => arr.reduce((a, d) => a + d.counts[k], 0);
    const tiles =
      '<div class="stats">' +
        '<div class="stat"><div class="lbl">Lists written</div><div class="val num">' + written.length + '<small>/ ' + schoolDaysSoFar + ' school days</small></div></div>' +
        '<div class="stat"><div class="lbl">Submitted</div><div class="val num">' + written.filter(d => d.submitted).length + '<small>/ ' + written.length + '</small></div></div>' +
        '<div class="stat"><div class="lbl">Bag checked</div><div class="val num">' + verified.length + '<small>/ ' + written.length + '</small></div></div>' +
        '<div class="stat"><div class="lbl">Arrived</div><div class="val num">' + (items.length ? pct(m.ta + m.na, items.length) + '<small>%</small>' : '—') + '</div></div>' +
        '<div class="stat' + (m.tm ? ' warn' : '') + '"><div class="lbl">Packing problems</div><div class="val num">' + m.tm + '</div></div>' +
        '<div class="stat' + (m.nm ? ' warn' : '') + '"><div class="lbl">Attention problems</div><div class="val num">' + m.nm + '</div></div>' +
      '</div>';

    // ── headline: the weekday that fails most, if any ──
    let headline = '';
    const wdStats = WD5.map(wd => { const s = hist.byWeekday[wd]; return s ? { wd, ...s, problems: s.tickedMissing + s.notTickedMissing, verifiedItems: s.arrived + s.missing } : null; }).filter(Boolean);
    const worst = wdStats.filter(w => w.verifiedItems >= 3).sort((a, b) => (b.problems / b.verifiedItems) - (a.problems / a.verifiedItems))[0];
    if (worst && worst.problems) {
      headline = '<div class="headline">' + icon('alert', 16) + ' <b>' + DAY_LONG[worst.wd] + '</b> is the weak spot: ' + worst.problems + ' of ' + worst.verifiedItems + ' checked items didn\'t make it home' +
        (worst.tickedMissing > worst.notTickedMissing ? ' — mostly <b>ticked but missing</b>, so the tick is happening before the item goes in the bag.' : worst.notTickedMissing > worst.tickedMissing ? ' — mostly <b>never ticked</b>, so the list isn\'t being read at the locker.' : ' — an even split of packing and attention misses.') + '</div>';
    } else if (items.length && !m.tm && !m.nm) {
      headline = '<div class="headline">' + icon('check', 16) + ' Everything that was checked arrived. Nothing to fix here.</div>';
    }

    // ── week grid ──
    const mondays = []; for (let k = hist.from; k <= hist.to; k = addDays(k, 7)) mondays.push(k);
    const cellFor = k => {
      const d = byDate.get(k);
      if (k > today) return '<span class="cell future"></span>';
      if (!d || !d.written) return '<a class="cell none' + (k === today ? ' today' : '') + '" href="' + href(withDate('/hq', k)) + '" data-link>' + (k === today ? 'today' : 'no list') + '</a>';
      const probs = d.counts.tickedMissing + d.counts.notTickedMissing;
      const cls = !d.submitted ? 'open' : !d.verified ? '' : probs ? 'warn' : 'ok';
      const line2 = !d.submitted ? 'not submitted' : !d.verified ? 'not checked' : probs ? probs + ' missing' : 'all arrived';
      return '<a class="cell ' + cls + (k === today ? ' today' : '') + '" href="' + href(withDate('/hq', k)) + '" data-link><b>' + d.counts.ticked + '/' + d.counts.items + '</b>' + line2 + '</a>';
    };
    const grid = '<table class="wgrid"><thead><tr><th class="wk">Week</th>' + WD5.map(wd => '<th>' + DAY_LABEL[wd] + '</th>').join('') + '</tr></thead><tbody>' +
      mondays.slice().reverse().map(mon => '<tr><td class="wk">' + fmtDate(mon).slice(4) + '</td>' + WD5.map((wd, i) => '<td>' + cellFor(addDays(mon, i)) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';

    // ── by weekday ──
    const wdRows = WD5.map(wd => {
      const s = hist.byWeekday[wd];
      if (!s) return '<tr><td><b>' + DAY_LABEL[wd] + '</b></td><td colspan="6" class="muted small">no lists yet</td></tr>';
      const vItems = s.arrived + s.missing;
      return '<tr><td><b>' + DAY_LABEL[wd] + '</b> <span class="muted small">' + s.days + ' list' + (s.days === 1 ? '' : 's') + '</span></td>' +
        '<td>' + rateHtml(s.submitted, s.days) + '</td><td>' + rateHtml(s.ticked, s.items, 'gold') + '</td><td>' + (s.verified ? rateHtml(s.arrived, vItems) : '<span class="muted small">not checked</span>') + '</td>' +
        '<td class="c' + (s.tickedMissing ? ' note-bad' : '') + '">' + s.tickedMissing + '</td><td class="c' + (s.notTickedMissing ? ' note-bad' : '') + '">' + s.notTickedMissing + '</td></tr>';
    }).join('');

    // ── trouble items (by label, case-insensitive) ──
    const byLabel = new Map();
    for (const d of written) for (const i of d.items) {
      const key = i.label.trim().toLowerCase();
      if (!byLabel.has(key)) byLabel.set(key, { label: i.label.trim(), listed: 0, ticked: 0, checked: 0, arrived: 0, tm: 0, nm: 0 });
      const t = byLabel.get(key);
      t.listed++; if (i.checked) t.ticked++;
      if (i.arrived !== null) { t.checked++; if (i.arrived) t.arrived++; else if (i.checked) t.tm++; else t.nm++; }
    }
    const trouble = [...byLabel.values()].filter(t => t.tm + t.nm > 0).sort((a, b) => (b.tm + b.nm) - (a.tm + a.nm) || b.listed - a.listed).slice(0, 12);
    const troubleRows = trouble.map(t => '<tr><td><b>' + esc(t.label) + '</b></td><td class="c">' + t.listed + '</td><td>' + rateHtml(t.ticked, t.listed, 'gold') + '</td><td>' + rateHtml(t.arrived, t.checked) + '</td><td class="c' + (t.tm ? ' note-bad' : '') + '">' + t.tm + '</td><td class="c' + (t.nm ? ' note-bad' : '') + '">' + t.nm + '</td></tr>').join('');

    // ── quests ──
    const questRows = qh.quests.filter(x => x.totals.active > 0).sort((a, b) => (b.requiredForStreak - a.requiredForStreak) || (pct(b.totals.done, b.totals.active) - pct(a.totals.done, a.totals.active))).map(x =>
      '<tr><td><b>' + esc(x.name) + '</b>' + (x.cadence === 'weekly' ? ' <span class="muted small">' + x.timesPerWeek + '×/wk</span>' : '') + (x.requiredForStreak ? '' : ' <span class="chip">not for streak</span>') + '</td>' +
      '<td>' + rateHtml(x.totals.done, x.totals.active) + '</td><td class="c">' + x.totals.done + ' / ' + x.totals.active + '</td>' +
      '<td><div class="qbar">' + x.weeks.map(w => '<i class="' + (w.active === 0 ? '' : w.done >= w.active ? 'p' : w.done > 0 ? 'h' : 'z') + '" title="' + fmtDate(w.monday) + ': ' + w.done + '/' + w.active + '"></i>').join('') + '</div></td></tr>').join('');

    // ── every day ──
    const dayRows = hist.days.filter(d => d.written || d.submitted).slice().reverse().map(d => '<tr><td><a href="' + href(withDate('/hq', d.date)) + '" data-link style="text-decoration:underline">' + fmtDate(d.date) + '</a></td>' +
      '<td class="c">' + (d.submitted ? '<span class="chip ok">yes</span>' : '<span class="chip">no</span>') + '</td><td class="c">' + d.counts.ticked + '/' + d.counts.items + '</td>' +
      '<td class="c">' + (d.verified ? d.counts.arrived + '/' + d.counts.items : '—') + '</td><td>' + (d.tickedMissing.length ? '<span class="note-bad">' + esc(d.tickedMissing.join(', ')) + '</span>' : '') + '</td><td>' + esc(d.notTicked.join(', ')) + '</td><td class="muted small">' + esc(d.note) + '</td></tr>').join('');

    main().innerHTML =
      '<div class="head"><div><h1>History</h1><div class="sub">' + fmtDate(hist.from) + ' – ' + fmtDate(hist.to) + '</div></div>' +
      '<span class="seg">' + [4, 8, 12, 26].map(w => '<a href="' + href('/hq/history?weeks=' + w) + '" data-link class="' + (w === weeks ? 'on' : '') + '">' + w + ' weeks</a>').join('') + '</span></div>' +
      tiles + headline +
      '<div class="grid2" style="grid-template-columns:1.2fr 1fr">' +
        '<div class="card"><div class="row spread" style="margin-bottom:8px"><h3>Pack check by week</h3><span class="muted small">click a day to open it</span></div>' + grid +
          '<div class="muted small" style="margin-top:8px">Ticked / listed. Green = everything arrived · red = something missing · amber = not submitted · grey = not checked yet.</div></div>' +
        '<div class="card"><h3 style="margin-bottom:8px">Ticked vs arrived</h3><div class="muted small" style="margin-bottom:10px">Every item on a day you checked the bag.</div>' +
          '<div class="matrix"><div></div><div class="mh">Arrived</div><div class="mh">Missing</div>' +
          '<div class="mh">Ticked</div><div class="mc good"><div class="n">' + m.ta + '</div><div class="l">packed and brought</div></div><div class="mc pack"><div class="n">' + m.tm + '</div><div class="l">packing problem — ticked, not in the bag</div></div>' +
          '<div class="mh">Not ticked</div><div class="mc"><div class="n">' + m.na + '</div><div class="l">arrived anyway</div></div><div class="mc attn"><div class="n">' + m.nm + '</div><div class="l">attention problem — never read the list</div></div></div>' +
          '<div class="muted small" style="margin-top:12px">Packing problems mean the tick happens before the item is in the bag — move the tick to the moment it goes in. Attention problems mean the list isn\'t being looked at — shorten it, or move the slip to where he\'ll see it.</div></div>' +
      '</div>' +
      '<div class="card" style="margin-top:14px"><h3 style="margin-bottom:10px">By weekday</h3><table><thead><tr><th>Day</th><th>Submitted</th><th>Ticked</th><th>Arrived</th><th class="c">Packing</th><th class="c">Attention</th></tr></thead><tbody>' + wdRows + '</tbody></table></div>' +
      '<div class="card"><h3 style="margin-bottom:4px">Items that go missing</h3><div class="muted small" style="margin-bottom:10px">The specific things worth a fix — a home for the reading log, a second copy of the textbook.</div>' +
        (trouble.length ? '<table><thead><tr><th>Item</th><th class="c">Listed</th><th>Ticked</th><th>Arrived</th><th class="c">Packing</th><th class="c">Attention</th></tr></thead><tbody>' + troubleRows + '</tbody></table>' : '<div class="empty">Nothing has gone missing in this range.</div>') + '</div>' +
      '<div class="card"><div class="row spread" style="margin-bottom:10px"><h3>Quests</h3><span class="muted small">done days / days on the board · one square per week</span></div>' +
        (questRows ? '<table><thead><tr><th>Quest</th><th>Done</th><th class="c">Days</th><th>By week</th></tr></thead><tbody>' + questRows + '</tbody></table>' : '<div class="empty">No quests on the board in this range.</div>') + '</div>' +
      '<div class="card"><details class="days"><summary>' + icon('right', 14) + ' Every day (' + hist.days.filter(d => d.written || d.submitted).length + ')</summary>' +
        (dayRows ? '<table style="margin-top:10px"><thead><tr><th>Date</th><th class="c">Submitted</th><th class="c">Ticked</th><th class="c">Arrived</th><th>Ticked, missing</th><th>Not ticked</th><th>Note</th></tr></thead><tbody>' + dayRows + '</tbody></table>' : '<div class="empty">No pack checks in this range yet.</div>') + '</details></div>';
  }

  // ── Quests editor (CRUD over config.quests / config.powerUps) ─────
  const DAYS7 = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  const KINDS = { simple: 'Done / not done', duration: 'Minutes', externalXp: 'External XP', count: 'Per unit', packCheck: 'Pack check' };
  async function renderQuests() {
    shell('/hq/quests', '<p class="muted">Loading…</p>');
    config = await api('/config');
    let editing = null; // quest id being edited, or 'new'
    const m = main();

    function questSummary(q) {
      const award = q.kind === 'count' ? awardText(q.perUnit) + ' per ' + esc(q.unitLabel || 'unit') : awardText(q);
      const when = (q.cadence || 'daily') === 'weekly' ? (q.timesPerWeek || 1) + '× a week' : (!q.activeDays || !q.activeDays.length || q.activeDays.length === 7 ? 'every day' : q.activeDays.map(d => DAY_LABEL[d]).join(' '));
      const target = q.kind === 'duration' || q.kind === 'externalXp' ? ' · target ' + q.target + ' ' + esc(q.unitLabel || '') : '';
      return '<div class="qn">' + esc(q.name) + (q.requiresParentConfirm ? ' <span class="chip">parent confirms</span>' : '') + (q.requiredForStreak === false ? '' : ' <span class="chip ok">streak</span>') + '</div>' +
        '<div class="qs">' + KINDS[q.kind] + target + ' · ' + when + ' · ' + award + '</div>';
    }
    function questForm(q, isNew) {
      const pu = config.powerUps || [];
      const isPack = q.kind === 'packCheck';
      const f = (label, name, val, type = 'number', cls = '') => '<div class="f ' + cls + '"><label>' + label + '</label><input type="' + type + '" name="' + name + '" value="' + esc(val == null ? '' : val) + '"' + (type === 'number' ? ' step="1"' : '') + '></div>';
      return '<form class="qform" data-qform="' + esc(q.id) + '">' +
        f('Name', 'name', q.name, 'text', 'span2') +
        '<div class="f"><label>Kind</label><select name="kind"' + (isPack ? ' disabled' : '') + '>' + Object.keys(KINDS).filter(k => k !== 'packCheck' || isPack).map(k => '<option value="' + k + '"' + (q.kind === k ? ' selected' : '') + '>' + KINDS[k] + '</option>').join('') + '</select></div>' +
        f('Target', 'target', q.target) + f('Unit label', 'unitLabel', q.unitLabel, 'text', 'span2') +
        f('XP', 'xp', q.xp) + f('Coins', 'coins', q.coins) + f('Screen min', 'screenMinutes', q.screenMinutes) +
        f('Per-unit XP', 'perXp', q.perUnit ? q.perUnit.xp : 0) + f('Per-unit coins', 'perCoins', q.perUnit ? q.perUnit.coins : 0) +
        '<div class="f"><label>Cadence</label><select name="cadence"><option value="daily"' + ((q.cadence || 'daily') === 'daily' ? ' selected' : '') + '>Daily</option><option value="weekly"' + (q.cadence === 'weekly' ? ' selected' : '') + '>Weekly</option></select></div>' +
        f('Times / week', 'timesPerWeek', q.timesPerWeek || 1) +
        '<div class="f span3"><label>Active days</label><div class="dayseg">' + DAYS7.map(d => '<button type="button" data-day="' + d + '" class="' + ((!q.activeDays || !q.activeDays.length || q.activeDays.includes(d)) ? 'on' : '') + '">' + DAY_LABEL[d] + '</button>').join('') + '</div></div>' +
        '<div class="f span2"><label>&nbsp;</label><div class="checkrow"><input type="checkbox" name="requiresParentConfirm" id="rpc_' + esc(q.id) + '"' + (q.requiresParentConfirm ? ' checked' : '') + '><label for="rpc_' + esc(q.id) + '" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:500">Parent confirms</label>' +
        '<input type="checkbox" name="requiredForStreak" id="rfs_' + esc(q.id) + '"' + (q.requiredForStreak !== false ? ' checked' : '') + ' style="margin-left:12px"><label for="rfs_' + esc(q.id) + '" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:500">Counts for streak</label></div></div>' +
        (isPack ? '' : '<div class="f span6"><label>Power-ups</label><div class="puchips">' + (pu.length ? pu.map(p => '<button type="button" data-pu="' + esc(p.id) + '" class="' + ((q.powerUps || []).includes(p.id) ? 'on' : '') + '">' + esc(p.label) + '</button>').join('') : '<span class="muted small">none defined</span>') + '</div></div>') +
        '<div class="actions"><button class="btn primary sm" type="submit">' + (isNew ? 'Add quest' : 'Save') + '</button><button class="btn sm" type="button" data-cancel>Cancel</button>' +
        '<div class="right">' + (isNew || isPack ? '' : '<button class="btn sm danger" type="button" data-del="' + esc(q.id) + '">Delete</button>') + '</div></div></form>';
    }
    function paint() {
      const quests = config.quests || [];
      const cards = quests.map((q, i) => '<div class="qcard' + (q.enabled === false ? ' off' : '') + '" data-q="' + esc(q.id) + '"><div class="qhead">' +
        '<button class="switch' + (q.enabled === false ? '' : ' on') + '" type="button" role="switch" aria-checked="' + (q.enabled !== false) + '" data-enable="' + esc(q.id) + '" title="Enabled"></button>' +
        '<div>' + questSummary(q) + '</div><div class="qr">' +
        '<button class="btn sm icon" type="button" data-move="' + i + ':-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>' + icon('left', 14) + '</button>' +
        '<button class="btn sm icon" type="button" data-move="' + i + ':1" aria-label="Move down"' + (i === quests.length - 1 ? ' disabled' : '') + '>' + icon('right', 14) + '</button>' +
        '<button class="btn sm" type="button" data-edit="' + esc(q.id) + '">' + (editing === q.id ? 'Editing' : 'Edit') + '</button></div></div>' +
        (editing === q.id ? questForm(q, false) : '') + '</div>').join('');
      const newCard = editing === 'new' ? '<div class="qcard" data-q="new"><div class="qhead"><div class="qn">New quest</div></div>' + questForm({ id: 'new', name: '', kind: 'duration', target: 20, unitLabel: 'minutes', xp: 8, coins: 2, screenMinutes: 10, activeDays: [], powerUps: [], requiresParentConfirm: false, requiredForStreak: true, enabled: true }, true) + '</div>' : '';
      const pus = (config.powerUps || []).map((p, i) => '<div class="ci" data-pui="' + i + '"><div style="flex:1;display:grid;grid-template-columns:2fr 3fr 70px 70px auto;gap:8px;align-items:center">' +
        '<input type="text" value="' + esc(p.label) + '" data-pf="label" placeholder="Label"><input type="text" value="' + esc(p.sub || '') + '" data-pf="sub" placeholder="One-line explanation">' +
        '<input type="number" value="' + (p.xp | 0) + '" data-pf="xp" title="XP"><input type="number" value="' + (p.coins | 0) + '" data-pf="coins" title="Coins">' +
        '<button class="btn sm danger" type="button" data-pu-rm="' + i + '">Remove</button></div></div>').join('');
      m.innerHTML =
        '<div class="head"><div><h1>Quests</h1><div class="sub">What\'s on Edward\'s board, what it pays, and which days.</div></div><button class="btn primary" type="button" data-new>' + icon('plus', 16) + ' New quest</button></div>' +
        newCard + cards +
        '<div class="card" style="margin-top:22px"><div class="row spread" style="margin-bottom:6px"><h3>Power-ups</h3><span class="muted small">Pay for how the work was done, never how it turned out.</span></div>' + pus +
        '<div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" type="button" data-pu-add>' + icon('plus', 14) + ' Add power-up</button><button class="btn sm primary" type="button" data-pu-save>Save power-ups</button></div></div>';
    }
    async function save(msg) {
      try { config = await api('/config', { method: 'PUT', body: config }); toast(msg || 'Saved'); editing = null; paint(); }
      catch (e) { toast(e.message, true); }
    }
    function readForm(f, q) {
      const num = n => Number(f[n] && f[n].value) || 0;
      const kind = f.kind.disabled ? q.kind : f.kind.value;
      const days = [...f.querySelectorAll('[data-day].on')].map(b => b.dataset.day);
      const out = { ...q, name: f.name.value.trim(), kind, target: num('target'), unitLabel: f.unitLabel.value.trim(),
        xp: num('xp'), coins: num('coins'), screenMinutes: num('screenMinutes'),
        cadence: f.cadence.value, timesPerWeek: Math.max(1, num('timesPerWeek')),
        activeDays: days.length === 7 ? [] : days,
        requiresParentConfirm: f.requiresParentConfirm.checked, requiredForStreak: f.requiredForStreak.checked,
        powerUps: [...f.querySelectorAll('[data-pu].on')].map(b => b.dataset.pu) };
      if (kind === 'count') out.perUnit = { xp: num('perXp'), coins: num('perCoins'), screenMinutes: 0 }; else delete out.perUnit;
      if (out.cadence === 'daily') delete out.timesPerWeek;
      return out;
    }
    L.on(m, 'click', '[data-new]', () => { editing = 'new'; paint(); window.scrollTo(0, 0); });
    L.on(m, 'click', '[data-edit]', (e, b) => { editing = editing === b.dataset.edit ? null : b.dataset.edit; paint(); });
    L.on(m, 'click', '[data-cancel]', () => { editing = null; paint(); });
    L.on(m, 'click', '[data-day]', (e, b) => b.classList.toggle('on'));
    L.on(m, 'click', '[data-pu]', (e, b) => b.classList.toggle('on'));
    L.on(m, 'click', '[data-enable]', (e, b) => { const q = config.quests.find(x => x.id === b.dataset.enable); q.enabled = q.enabled === false; save(q.enabled ? q.name + ' enabled' : q.name + ' disabled'); });
    L.on(m, 'click', '[data-move]', (e, b) => { const [i, d] = b.dataset.move.split(':').map(Number); const j = i + d; if (j < 0 || j >= config.quests.length) return; [config.quests[i], config.quests[j]] = [config.quests[j], config.quests[i]]; save('Reordered'); });
    L.on(m, 'click', '[data-del]', (e, b) => {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Really delete?'; return; }
      config.quests = config.quests.filter(q => q.id !== b.dataset.del); save('Deleted');
    });
    L.on(m, 'submit', '[data-qform]', (e, f) => {
      e.preventDefault();
      const id = f.dataset.qform;
      if (id === 'new') {
        const name = f.name.value.trim(); if (!name) { toast('Name required', true); return; }
        let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'quest', slug = base, n = 2;
        while (config.quests.some(q => q.id === slug)) slug = base + '-' + n++;
        config.quests.push(readForm(f, { id: slug, enabled: true })); save('Added ' + name);
      } else {
        const i = config.quests.findIndex(q => q.id === id); if (i < 0) return;
        config.quests[i] = readForm(f, config.quests[i]); save('Saved ' + config.quests[i].name);
      }
    });
    L.on(m, 'click', '[data-pu-add]', () => { (config.powerUps = config.powerUps || []).push({ id: 'pu-' + Date.now().toString(36), label: '', sub: '', xp: 2, coins: 0 }); paint(); });
    L.on(m, 'click', '[data-pu-rm]', (e, b) => { config.powerUps.splice(Number(b.dataset.puRm), 1); paint(); });
    L.on(m, 'click', '[data-pu-save]', () => {
      m.querySelectorAll('[data-pui]').forEach(row => { const p = config.powerUps[Number(row.dataset.pui)]; row.querySelectorAll('[data-pf]').forEach(inp => { p[inp.dataset.pf] = inp.type === 'number' ? Number(inp.value) || 0 : inp.value.trim(); }); });
      config.powerUps = config.powerUps.filter(p => p.label);
      save('Power-ups saved');
    });
    paint();
  }

  // ── Rewards editor ────────────────────────────────────────────────
  async function renderRewards() {
    shell('/hq/rewards', '<p class="muted">Loading…</p>');
    let requests;
    [config, requests] = await Promise.all([api('/config'), api('/requests?limit=100')]);
    let editing = null;
    const m = main();
    function form(r, isNew) {
      const f = (label, name, val, type = 'number', cls = '') => '<div class="f ' + cls + '"><label>' + label + '</label><input type="' + type + '" name="' + name + '" value="' + esc(val == null ? '' : val) + '"' + (type === 'number' ? ' min="0" step="1"' : '') + '></div>';
      return '<form class="qform" data-rform="' + esc(r.id) + '">' + f('Name', 'name', r.name, 'text', 'span2') + f('Coins', 'coins', r.cost && r.cost.coins || 0) + f('Screen minutes', 'screenMinutes', r.cost && r.cost.screenMinutes || 0) + f('Note (shown to Edward)', 'note', r.note, 'text', 'span2') +
        '<div class="f span2"><label>&nbsp;</label><div class="checkrow"><input type="checkbox" name="savingsGoal" id="sg_' + esc(r.id) + '"' + (r.savingsGoal ? ' checked' : '') + '><label for="sg_' + esc(r.id) + '" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:500">Savings goal (progress bar in the vault)</label></div></div>' +
        '<div class="actions"><button class="btn primary sm" type="submit">' + (isNew ? 'Add reward' : 'Save') + '</button><button class="btn sm" type="button" data-cancel>Cancel</button><div class="right">' + (isNew ? '' : '<button class="btn sm danger" type="button" data-del="' + esc(r.id) + '">Delete</button>') + '</div></div></form>';
    }
    function paint() {
      const rs = config.rewards || [];
      const cards = rs.map((r, i) => '<div class="qcard' + (r.enabled === false ? ' off' : '') + '" data-r="' + esc(r.id) + '"><div class="qhead">' +
        '<button class="switch' + (r.enabled === false ? '' : ' on') + '" type="button" role="switch" aria-checked="' + (r.enabled !== false) + '" data-enable="' + esc(r.id) + '"></button>' +
        '<div><div class="qn">' + esc(r.name) + (r.savingsGoal ? ' <span class="chip gold">savings goal</span>' : '') + (r.suggested ? ' <span class="chip">suggested by Edward</span>' : '') + '</div><div class="qs">' + costText(r.cost) + (r.note ? ' · ' + esc(r.note) : '') + '</div></div>' +
        '<div class="qr"><button class="btn sm icon" type="button" data-move="' + i + ':-1"' + (i === 0 ? ' disabled' : '') + '>' + icon('left', 14) + '</button><button class="btn sm icon" type="button" data-move="' + i + ':1"' + (i === rs.length - 1 ? ' disabled' : '') + '>' + icon('right', 14) + '</button><button class="btn sm" type="button" data-edit="' + esc(r.id) + '">' + (editing === r.id ? 'Editing' : 'Edit') + '</button></div></div>' +
        (editing === r.id ? form(r, false) : '') + '</div>').join('');
      const newCard = editing === 'new' ? '<div class="qcard"><div class="qhead"><div class="qn">New reward</div></div>' + form({ id: 'new', name: '', cost: { coins: 20 }, enabled: true }, true) + '</div>' : '';
      const hist = requests.length ? '<table><thead><tr><th>When</th><th>Request</th><th>Cost</th><th>Status</th><th>Note</th></tr></thead><tbody>' + requests.map(r => '<tr><td class="muted small">' + fmtDate(r.requestedAt.slice(0, 10)) + '</td><td>' + esc(r.name) + (r.kind === 'suggest' ? ' <span class="chip">suggestion</span>' : '') + '</td><td>' + costText(r.cost) + '</td><td><span class="chip' + (r.status === 'approved' ? ' ok' : r.status === 'open' ? ' gold' : '') + '">' + r.status + '</span></td><td class="muted small">' + esc(r.note) + '</td></tr>').join('') + '</tbody></table>' : '<div class="empty">No requests yet.</div>';
      m.innerHTML = '<div class="head"><div><h1>Rewards</h1><div class="sub">What coins and screen minutes buy. Open requests are approved from the daily log.</div></div><button class="btn primary" type="button" data-new>' + icon('plus', 16) + ' New reward</button></div>' +
        newCard + cards + '<div class="card" style="margin-top:22px"><h3 style="margin-bottom:10px">Requests</h3>' + hist + '</div>';
    }
    async function save(msg) { try { config = await api('/config', { method: 'PUT', body: config }); toast(msg || 'Saved'); editing = null; paint(); } catch (e) { toast(e.message, true); } }
    function read(f, r) {
      const coins = Math.max(0, Number(f.coins.value) || 0), screenMinutes = Math.max(0, Number(f.screenMinutes.value) || 0);
